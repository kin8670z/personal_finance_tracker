    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16,185,129,.55); } 70% { box-shadow: 0 0 0 7px rgba(16,185,129,0); } 100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); } }

    @keyframes fd { 0% { background: rgba(37,99,235,.18); } 100% { background: transparent; } }

  <script>
    const KEY = 'argon_todo_v1';
    function load(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
    function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const isDark = () => document.documentElement.classList.contains('dark');
    const pad = n => String(n).padStart(2, '0');
    const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const W = '일월화수목금토';
    const dateOf = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
    const newId = list => Math.max(Date.now(), ...list.map(x => x.id + 1));

    let st = Object.assign({ todos: [], shop: [], hist: [], tab: 'todo' }, load(KEY, {}));
    const persist = () => save(KEY, st);
    let dueSel = '';

    function setTab(t) { st.tab = t; persist(); renderTabs(); }
    function renderTabs() {
      ['todo', 'shop'].forEach(t => {
        const el = document.getElementById(t === 'todo' ? 'tabTodo' : 'tabShop');
        el.className = `cursor-pointer py-1.5 rounded-lg text-center text-sm font-extrabold ${st.tab === t ? 'bg-indigo-600 text-white' : 'text-slate-500'}`;
        el.setAttribute('aria-selected', String(st.tab === t));
      });
      document.getElementById('todoSec').classList.toggle('hidden', st.tab !== 'todo');
      document.getElementById('shopSec').classList.toggle('hidden', st.tab !== 'shop');
    }

    // ---------- 할 일 ----------
    function dueLabel(due) {
      if (!due) return '';
      const n = Math.round((dateOf(due) - dateOf(ymd(new Date()))) / 864e5), d = dateOf(due);
      const txt = n === 0 ? '오늘' : n === 1 ? '내일' : n === -1 ? '어제' : n < 0 ? `${-n}일 지남` : n < 7 ? `${W[d.getDay()]}요일` : `${d.getMonth() + 1}/${d.getDate()}`;
      return `<span class="text-[10px] font-bold px-1.5 py-0.5 rounded-full ${n < 0 ? 'bg-rose-100 text-rose-600' : n === 0 ? 'bg-amber-100 text-amber-700' : 'bg-slate-100 text-slate-500'}">${txt}</span>`;
    }
    function renderDueQuick() {
      const t = new Date(), opts = [['', '언제든'], [ymd(t), '오늘'], [ymd(new Date(t.getFullYear(), t.getMonth(), t.getDate() + 1)), '내일'], [ymd(new Date(t.getFullYear(), t.getMonth(), t.getDate() + ((6 - t.getDay() + 7) % 7 || 7))), '주말']];
      document.getElementById('dueQuick').innerHTML = opts.map(([v, l]) => `<span role="button" tabindex="0" onclick="setDue('${v}')" class="cursor-pointer px-2 py-0.5 rounded-md ${dueSel === v ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-500'}">${l}</span>`).join('');
      document.getElementById('tDue').value = dueSel;
    }
    function setDue(v) { dueSel = v; renderDueQuick(); }
    document.getElementById('tDue').addEventListener('change', e => { dueSel = e.target.value; renderDueQuick(); });
    document.getElementById('todoForm').addEventListener('submit', e => {
      e.preventDefault();
      const text = document.getElementById('tText').value.trim(); if (!text) return;
      st.todos.push({ id: newId(st.todos), text, due: dueSel, done: false, at: Date.now() });
      document.getElementById('tText').value = ''; dueSel = ''; renderDueQuick(); persist(); renderTodos();
    });
    function toggleTodo(id) { const t = st.todos.find(x => x.id === id); if (!t) return; t.done = !t.done; t.doneAt = t.done ? Date.now() : null; persist(); renderTodos(); }
    function delTodo(id) { st.todos = st.todos.filter(x => x.id !== id); persist(); renderTodos(); }
    function clearDone() { st.todos = st.todos.filter(x => !x.done); persist(); renderTodos(); }
    function renderTodos() {
      const open = st.todos.filter(x => !x.done).sort((a, b) => (a.due || '9999') .localeCompare(b.due || '9999') || a.at - b.at);
      const done = st.todos.filter(x => x.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
      const row = x => `<div class="flex items-center gap-2 py-2">
          <span role="checkbox" tabindex="0" aria-checked="${x.done}" onclick="toggleTodo(${x.id})" class="cursor-pointer w-6 h-6 rounded-lg border-2 flex items-center justify-center shrink-0 ${x.done ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300'}">${x.done ? '✓' : ''}</span>
          <span class="flex-1 min-w-0 text-sm ${x.done ? 'line-through text-slate-400' : 'text-slate-800 font-bold'} break-words">${esc(x.text)}</span>
          ${x.done ? '' : dueLabel(x.due)}
          <span role="button" tabindex="0" onclick="delTodo(${x.id})" aria-label="지우기" class="cursor-pointer text-slate-300 text-xs px-1 shrink-0">✕</span>
        </div>`;
      document.getElementById('todoList').innerHTML = (open.length ? `<div class="divide-y divide-slate-100">${open.map(row).join('')}</div>` : `<p class="text-xs text-slate-400 py-2">할 일이 없어요 🎉</p>`) +
        (done.length ? `<div class="mt-3"><div class="flex justify-between items-center"><p class="text-[11px] font-bold text-slate-400">완료 ${done.length}</p><span role="button" tabindex="0" onclick="clearDone()" class="cursor-pointer text-[11px] font-bold text-slate-400">완료 비우기</span></div><div class="divide-y divide-slate-100">${done.slice(0, 20).map(row).join('')}</div></div>` : '');
      renderSub();
    }

    // ---------- 장보기 ----------
    document.getElementById('shopForm').addEventListener('submit', e => {
      e.preventDefault();
      const name = document.getElementById('sName').value.trim(); if (!name) return;
      st.shop.push({ id: newId(st.shop), name, qty: document.getElementById('sQty').value.trim(), done: false, price: null });
      st.hist = [name, ...st.hist.filter(x => x !== name)].slice(0, 60);
      document.getElementById('sName').value = ''; document.getElementById('sQty').value = '';
      persist(); renderShop(); document.getElementById('sName').focus();
    });
    function toggleShop(id) { const s = st.shop.find(x => x.id === id); if (!s) return; s.done = !s.done; persist(); renderShop(); }
    function delShop(id) { st.shop = st.shop.filter(x => x.id !== id); persist(); renderShop(); }
    function setPrice(id, v) { const s = st.shop.find(x => x.id === id); if (!s) return; const n = Number(String(v).replace(/[^\d]/g, '')); s.price = n > 0 ? n : null; persist(); renderShopDone(); }
    function renderShop() {
      document.getElementById('shopHist').innerHTML = st.hist.map(n => `<option value="${esc(n)}">`).join('');
      const todo = st.shop.filter(x => !x.done), got = st.shop.filter(x => x.done);
      document.getElementById('shopList').innerHTML = todo.length ? `<div class="divide-y divide-slate-100">${todo.map(x => `<div class="flex items-center gap-2 py-2">
          <span role="checkbox" tabindex="0" aria-checked="false" onclick="toggleShop(${x.id})" class="cursor-pointer w-6 h-6 rounded-lg border-2 border-slate-300 shrink-0"></span>
          <span class="flex-1 min-w-0 text-sm font-bold text-slate-800">${esc(x.name)}${x.qty ? ` <span class="text-xs text-slate-400">${esc(x.qty)}</span>` : ''}</span>
          <span role="button" tabindex="0" onclick="delShop(${x.id})" aria-label="지우기" class="cursor-pointer text-slate-300 text-xs px-1">✕</span></div>`).join('')}</div>`
        : `<p class="text-xs text-slate-400 py-2">${got.length ? '다 샀어요! 아래에서 가계부로 보내세요 🛍️' : '살 것을 추가해 보세요. 전에 산 것은 자동완성돼요.'}</p>`;
      renderShopDone(); renderSub();
    }
    function renderShopDone() {
      const got = st.shop.filter(x => x.done), total = got.reduce((s, x) => s + (x.price || 0), 0);
      document.getElementById('shopDone').innerHTML = got.length ? `<div class="rounded-xl bg-emerald-50 p-3">
          <p class="text-xs font-extrabold text-emerald-700 mb-1.5">🛍️ 산 것 ${got.length}개 <span class="font-bold text-emerald-600/70">· 가격은 적고 싶은 것만</span></p>
          <div class="space-y-1">${got.map(x => `<div class="flex items-center gap-2">
              <span role="checkbox" tabindex="0" aria-checked="true" onclick="toggleShop(${x.id})" class="cursor-pointer w-5 h-5 rounded-md bg-emerald-500 text-white text-xs flex items-center justify-center shrink-0">✓</span>
              <span class="flex-1 min-w-0 text-sm line-through text-slate-500 truncate">${esc(x.name)}${x.qty ? ` ${esc(x.qty)}` : ''}</span>
              <input inputmode="numeric" value="${x.price ? x.price.toLocaleString('ko-KR') : ''}" placeholder="가격" onchange="setPrice(${x.id}, this.value)" class="w-24 border border-slate-200 rounded-lg px-2 py-0.5 bg-white text-right num" style="font-size:13px!important">
            </div>`).join('')}</div>
          <div class="flex items-center gap-2 mt-2.5 flex-wrap">
            <span class="text-sm font-extrabold text-slate-800 num">합계 ${total.toLocaleString('ko-KR')}원</span>
            <select id="shopMethod" class="ml-auto border border-slate-200 rounded-lg px-2 py-1 bg-white" style="font-size:12px!important"><option>신용카드</option><option>체크카드</option><option>간편페이</option><option>현금</option></select>
            <select id="shopCat" class="border border-slate-200 rounded-lg px-2 py-1 bg-white" style="font-size:12px!important"><option>🍔 식비</option><option>🛍️ 쇼핑/생활</option></select>
          </div>
          <div class="flex gap-2 mt-2">
            <span role="button" tabindex="0" onclick="clearGot()" class="cursor-pointer flex-1 py-2 text-center rounded-xl bg-white text-slate-500 font-bold text-xs border border-slate-200">목록에서만 지우기</span>
            <span role="button" tabindex="0" onclick="toLedger()" class="cursor-pointer flex-[2] py-2 text-center rounded-xl text-white font-bold text-sm ${total ? '' : 'opacity-50'}" style="background:#059669">📒 가계부에 ${total ? total.toLocaleString('ko-KR') + '원 ' : ''}기록</span>
          </div></div>` : '';
    }
    function clearGot() { st.shop = st.shop.filter(x => !x.done); persist(); renderShop(); }
    // 산 것 합계를 가계부(argon_tx_v3)에 지출 한 건으로
    function toLedger() {
      const got = st.shop.filter(x => x.done), total = got.reduce((s, x) => s + (x.price || 0), 0);
      if (!total) { alertMsg('가격을 하나 이상 적어 주세요.'); return; }
      const tx = load('argon_tx_v3', null);
      if (!Array.isArray(tx)) { alertMsg('가계부를 한 번 열어서 시작한 뒤에 보낼 수 있어요.'); return; }
      const now = new Date(), id = Math.max(Date.now(), ...tx.map(x => (x.id || 0) + 1));
      const memo = got.map(x => `${x.name}${x.qty ? ' ' + x.qty : ''}${x.price ? ' ' + x.price.toLocaleString('ko-KR') : ''}`).join(', ').slice(0, 200);
      tx.push({ id, createdAt: Date.now() * 1000, date: ymd(now), type: 'expense', category: document.getElementById('shopCat').value, method: document.getElementById('shopMethod').value, cardCompany: '', merchant: '장보기', memo, amount: total, installmentMonths: 1, installmentCurrent: 1, installmentTotalAmount: total, groupId: null });
      save('argon_tx_v3', tx);
      st.shop = st.shop.filter(x => !x.done); persist(); renderShop();
      alertMsg(`가계부에 ${total.toLocaleString('ko-KR')}원 기록했어요 📒`, true);
    }
    function alertMsg(t, ok) { const el = document.getElementById('shopDone'); el.insertAdjacentHTML('afterbegin', `<p class="text-xs font-bold ${ok ? 'text-emerald-600' : 'text-rose-600'} mb-2">${esc(t)}</p>`); }

    function renderSub() {
      const today = ymd(new Date()), open = st.todos.filter(x => !x.done), dueToday = open.filter(x => x.due && x.due <= today).length, shop = st.shop.filter(x => !x.done).length;
      document.getElementById('sub').textContent = `할 일 ${open.length}개${dueToday ? ` (오늘까지 ${dueToday})` : ''} · 장보기 ${shop}개`;
    }

    function openSideNav() { document.getElementById('sideNav').classList.add('open'); document.getElementById('sideNavBackdrop').classList.add('open'); }
    function closeSideNav() { document.getElementById('sideNav').classList.remove('open'); document.getElementById('sideNavBackdrop').classList.remove('open'); }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSideNav(); });
    function toggleDark() {
      const on = !isDark(); document.documentElement.classList.toggle('dark', on);
      try { localStorage.setItem('argon_dark_mode', String(on)); } catch (e) {}
      document.getElementById('darkBtn').textContent = on ? '☀️ 라이트 모드' : '🌙 다크 모드';
    }
    document.getElementById('darkBtn').textContent = isDark() ? '☀️ 라이트 모드' : '🌙 다크 모드';
    window.addEventListener('storage', e => { if (e.key === KEY) { st = Object.assign({ todos: [], shop: [], hist: [], tab: st.tab }, load(KEY, {})); renderTodos(); renderShop(); } });
    const qt = new URLSearchParams(location.search).get('tab'); if (qt === 'shop' || qt === 'todo') st.tab = qt;
    renderTabs(); renderDueQuick(); renderTodos(); renderShop();
  </script>
</body>
</html>
