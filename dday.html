  <style>
    html, body { width: 100%; max-width: 100vw; min-height: 100dvh; overflow-x: hidden; font-family: 'Pretendard', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }

    .hero-up { background: linear-gradient(135deg, #fff1f2 0%, #ffffff 70%); } .hero-down { background: linear-gradient(135deg, #eff6ff 0%, #ffffff 70%); } .hero-flat { background: #fff; }

  <style>
    .snow { position: absolute; top: -10px; color: #fff; opacity: .9; pointer-events: none; animation: fall linear infinite; text-shadow: 0 0 4px rgba(255,255,255,.6); }
    @keyframes fall { to { transform: translateY(260px) translateX(20px); } }
    @media (prefers-reduced-motion: reduce) { .snow { display: none; } }
    .bounce { animation: bounce 1.6s ease-in-out infinite; display: inline-block; }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  </style>
  <script>
    const KEY = 'argon_dday_v1';
    const DEFAULT = [
      { id: 1, name: '크리스마스', emoji: '🎄', date: '2026-12-25', yearly: true, pin: true },
      { id: 2, name: '새해', emoji: '🎆', date: '2027-01-01', yearly: true },
      { id: 3, name: '설날', emoji: '🧧', date: '2027-02-07', yearly: false },
      { id: 4, name: '어린이날', emoji: '🎈', date: '2027-05-05', yearly: true }
    ];
    function load(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
    function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const isDark = () => document.documentElement.classList.contains('dark');
    const pad = n => String(n).padStart(2, '0');
    const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const W = '일월화수목금토';
    const dateOf = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
    const today0 = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
    const diffDays = (a, b) => Math.round((b - a) / 864e5);   // 날짜끼리 (자정 기준)
    // 받침 있으면 '이에요', 없으면 '예요' (설날이에요 / 크리스마스예요)
    const iyeyo = w => { const c = String(w).charCodeAt(String(w).length - 1); return c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 ? '이에요' : '예요'; };
    const fmtDate = d => `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()} (${W[d.getDay()]})`;

    let st = load(KEY, null) || { items: DEFAULT, sel: 1 };
    let editId = null;
    const persist = () => save(KEY, st);

    // 매년 반복이면 오늘 이후(오늘 포함) 가장 가까운 날짜로
    function nextDate(it) {
      const d = dateOf(it.date), t = today0();
      if (!it.yearly) return d;
      let n = new Date(t.getFullYear(), d.getMonth(), d.getDate());
      if (n < t) n = new Date(t.getFullYear() + 1, d.getMonth(), d.getDate());
      return n;
    }
    function info(it) {
      const t = today0(), d = nextDate(it), n = diffDays(t, d);
      if (n > 0) return { d, n, text: `D-${n}`, kind: 'future' };
      if (n === 0) return { d, n, text: 'D-DAY', kind: 'today' };
      // 지난 날: D+ (그날을 1일째로 세는 한국식)
      const since = -n + 1, ms = [100, 200, 300, 500, 1000, 2000, 3000];
      const nextM = ms.find(m => m > since);
      const birthY = dateOf(it.date);
      let anniv = new Date(t.getFullYear(), birthY.getMonth(), birthY.getDate()); if (anniv <= t) anniv = new Date(t.getFullYear() + 1, birthY.getMonth(), birthY.getDate());
      const years = anniv.getFullYear() - birthY.getFullYear();
      return { d, n, since, text: `D+${since}`, kind: 'past', nextM, nextMIn: nextM ? nextM - since : null, nextMDate: nextM ? new Date(dateOf(it.date).getTime() + (nextM - 1) * 864e5) : null, anniv, years, annivIn: diffDays(t, anniv) };
    }

    // ---------- 크게 보기 ----------
    function renderHero() {
      const box = document.getElementById('hero'), it = st.items.find(x => x.id === st.sel) || st.items[0];
      if (!it) { box.innerHTML = `<p class="p-6 text-sm text-slate-500">아래에서 D-Day를 추가해 보세요.</p>`; return; }
      const f = info(it), xmas = /크리스마스|성탄/.test(it.name);
      const bg = xmas ? 'background:linear-gradient(160deg,#0f5132 0%,#14532d 45%,#7f1d1d 100%)' : 'background:linear-gradient(160deg,#4f46e5 0%,#7c3aed 100%)';
      const snow = xmas ? Array.from({ length: 22 }, (_, i) => `<span class="snow" style="left:${(i * 4.7 + (i % 3) * 7) % 100}%;font-size:${10 + (i % 4) * 4}px;animation-duration:${5 + (i % 5)}s;animation-delay:-${(i * 0.7) % 6}s">❄</span>`).join('') : '';
      let main, sub;
      if (f.kind === 'future') {
        main = `<p class="text-white/80 text-sm font-bold">${esc(it.name)}까지</p>
          <p class="text-white font-extrabold leading-none mt-1" style="font-size:clamp(3.5rem,18vw,6rem)">${f.n}<span class="text-2xl ml-1">${xmas || f.n <= 60 ? '밤' : '일'}</span></p>
          <p class="text-white text-base font-extrabold mt-2">${xmas || f.n <= 60 ? `${f.n}밤 자면 ${esc(it.name)}${iyeyo(it.name)}! ` : `남았어요 `}<span class="bounce">${esc(it.emoji)}</span></p>`;
        sub = `${fmtDate(f.d)} · ${f.n >= 7 ? `${Math.floor(f.n / 7)}주 ${f.n % 7}일` : '이번 주'}`;
      } else if (f.kind === 'today') {
        main = `<p class="text-white font-extrabold leading-tight mt-2" style="font-size:clamp(2.2rem,10vw,3.5rem)">오늘이 ${esc(it.name)}! <span class="bounce">${esc(it.emoji)}</span></p>`;
        sub = fmtDate(f.d);
      } else {
        main = `<p class="text-white/80 text-sm font-bold">${esc(it.name)}부터</p>
          <p class="text-white font-extrabold leading-none mt-1" style="font-size:clamp(3.2rem,16vw,5.5rem)">${f.since.toLocaleString()}<span class="text-2xl ml-1">일째</span></p>
          <p class="text-white text-sm font-bold mt-2">${f.nextM ? `${f.nextM}일까지 ${f.nextMIn}일 (${fmtDate(f.nextMDate)})` : ''}${f.years > 0 ? ` · ${f.years}주년까지 ${f.annivIn}일` : ''}</p>`;
        sub = `${fmtDate(dateOf(it.date))}부터`;
      }
      // 12월이고 크리스마스면 25칸 어드벤트 달력
      let advent = '';
      if (xmas && f.kind !== 'past') {
        const t = today0(), dec = t.getMonth() === 11, day = dec ? t.getDate() : 0;
        advent = `<div class="grid gap-1 mt-4" style="grid-template-columns:repeat(13,minmax(0,1fr))">${Array.from({ length: 25 }, (_, i) => { const d = i + 1, done = d < day, now = d === day; return `<span class="aspect-square rounded-md flex items-center justify-center text-[9px] font-extrabold ${d === 25 ? 'bg-amber-300 text-red-700' : done ? 'bg-white/90 text-emerald-800' : now ? 'bg-red-500 text-white ring-2 ring-white' : 'bg-white/15 text-white/70'}">${d === 25 ? '★' : done ? '✓' : d}</span>`; }).join('')}</div>
          <p class="text-[10px] text-white/70 mt-1">${dec ? '12월 달력 · 지난 날은 ✓' : '12월이 되면 하루에 한 칸씩 지워져요'}</p>`;
      }
      box.innerHTML = `<div class="absolute inset-0" style="${bg}"></div>${snow}
        <div class="relative p-5 text-center">${main}<p class="text-white/70 text-xs font-bold mt-2">${sub}</p>${advent}</div>`;
    }

    // ---------- 목록 ----------
    function renderList() {
      const rows = st.items.map(it => ({ it, f: info(it) })).sort((a, b) => (a.f.kind === 'past') - (b.f.kind === 'past') || a.f.n - b.f.n);
      document.getElementById('list').innerHTML = rows.length ? rows.map(({ it, f }) => `<div class="flex items-center gap-2 rounded-xl px-3 py-2 ${it.id === st.sel ? 'bg-indigo-50 ring-1 ring-indigo-200' : 'bg-slate-50'}">
          <span role="button" tabindex="0" onclick="pick(${it.id})" class="cursor-pointer flex-1 min-w-0 flex items-center gap-2">
            <span class="text-2xl shrink-0">${esc(it.emoji)}</span>
            <span class="min-w-0"><span class="block text-sm font-extrabold text-slate-800 truncate">${esc(it.name)}</span><span class="block text-[10px] text-slate-400 truncate">${fmtDate(f.kind === 'past' ? dateOf(it.date) : f.d)}${it.yearly ? ' · 매년' : ''}${f.kind === 'past' && f.nextM ? ` · ${f.nextM}일까지 ${f.nextMIn}일` : ''}</span></span>
          </span>
          <span class="text-base font-extrabold num shrink-0 ${f.kind === 'today' ? 'text-rose-600' : f.kind === 'past' ? 'text-emerald-600' : 'text-indigo-600'}">${f.text}</span>
          <span role="button" tabindex="0" onclick="togglePin(${it.id})" aria-label="오늘 화면에 고정" title="오늘 화면에 고정" class="cursor-pointer text-base shrink-0 ${it.pin ? '' : 'opacity-25'}">⭐</span>
          <span role="button" tabindex="0" onclick="editItem(${it.id})" aria-label="수정" class="cursor-pointer text-xs font-bold text-slate-400 shrink-0">수정</span>
        </div>`).join('') : `<p class="text-xs text-slate-400">아래에서 추가해 보세요.</p>`;
    }
    function pick(id) { st.sel = id; persist(); renderAll(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    function togglePin(id) { const it = st.items.find(x => x.id === id); if (it) { it.pin = !it.pin; persist(); renderList(); } }
    function editItem(id) {
      const it = st.items.find(x => x.id === id); if (!it) return;
      editId = id; document.getElementById('fEmoji').value = it.emoji; document.getElementById('fName').value = it.name; document.getElementById('fDate').value = it.date; document.getElementById('fYearly').checked = !!it.yearly;
      document.getElementById('formTitle').textContent = '✏️ D-Day 수정'; document.getElementById('fSubmit').textContent = '저장';
      document.getElementById('fCancel').classList.remove('hidden');
      document.getElementById('fCancel').textContent = '삭제'; document.getElementById('fCancel').onclick = () => { st.items = st.items.filter(x => x.id !== id); if (st.sel === id) st.sel = st.items[0] && st.items[0].id; persist(); resetForm(); renderAll(); };
      document.getElementById('form').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    function resetForm() {
      editId = null; document.getElementById('form').reset(); document.getElementById('fEmoji').value = '🎉';
      document.getElementById('formTitle').textContent = '➕ D-Day 추가'; document.getElementById('fSubmit').textContent = '추가';
      document.getElementById('fCancel').classList.add('hidden');
    }
    document.getElementById('form').addEventListener('submit', e => {
      e.preventDefault();
      const name = document.getElementById('fName').value.trim(), date = document.getElementById('fDate').value;
      if (!name || !date) return;
      const data = { name, date, emoji: document.getElementById('fEmoji').value.trim() || '🎉', yearly: document.getElementById('fYearly').checked };
      if (editId) Object.assign(st.items.find(x => x.id === editId), data);
      else { const id = Math.max(Date.now(), ...st.items.map(x => x.id + 1)); st.items.push({ id, ...data }); st.sel = id; }
      persist(); resetForm(); renderAll(); window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // ---------- 계산기 ----------
    function calc() {
      const a = document.getElementById('cA').value, b = document.getElementById('cB').value;
      if (a && b) { const n = diffDays(dateOf(a), dateOf(b)); document.getElementById('cOut').textContent = `${Math.abs(n).toLocaleString()}일 차이 (처음 날 포함 ${(Math.abs(n) + 1).toLocaleString()}일째) · 약 ${(Math.abs(n) / 7).toFixed(1)}주`; }
      const k = Number(document.getElementById('nDays').value);
      if (k) { const d = new Date(today0().getTime() + k * 864e5); document.getElementById('nOut').textContent = `${fmtDate(d)}`; }
    }
    ['cA', 'cB', 'nDays'].forEach(id => document.getElementById(id).addEventListener('input', calc));

    function renderAll() {
      document.getElementById('todayLine').textContent = `오늘 ${fmtDate(today0())}`;
      renderHero(); renderList();
    }

    function openSideNav() { document.getElementById('sideNav').classList.add('open'); document.getElementById('sideNavBackdrop').classList.add('open'); }
    function closeSideNav() { document.getElementById('sideNav').classList.remove('open'); document.getElementById('sideNavBackdrop').classList.remove('open'); }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSideNav(); });
    function toggleDark() {
      const on = !isDark(); document.documentElement.classList.toggle('dark', on);
      try { localStorage.setItem('argon_dark_mode', String(on)); } catch (e) {}
      document.getElementById('darkBtn').textContent = on ? '☀️ 라이트 모드' : '🌙 다크 모드';
    }
    document.getElementById('darkBtn').textContent = isDark() ? '☀️ 라이트 모드' : '🌙 다크 모드';
    window.addEventListener('storage', e => { if (e.key === KEY) { st = load(KEY, st); renderAll(); } });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') renderAll(); });   // 자정 지나면 갱신
    document.getElementById('cA').value = ymd(today0()); document.getElementById('cB').value = '2026-12-25';
    renderAll(); calc();
  </script>
</body>
</html>
