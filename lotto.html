  <script>
    const MINE_KEY = 'argon_lotto_v1';
    const MODES = {
      balance: { label: '⚖️ 균형형', desc: '홀짝 2~4개, 낮은 번호(1~22) 2~4개, 합계 100~175, 연속 번호는 1쌍까지. 지난 당첨 조합들이 흔히 보인 모양으로 맞춰요.' },
      hot:     { label: '🔥 핫 번호', desc: '고른 기간에 자주 나온 번호일수록 더 잘 뽑혀요.' },
      cold:    { label: '🧊 콜드 번호', desc: '오래 안 나온 번호일수록 더 잘 뽑혀요. ("이제 나올 때 됐다" 전략)' },
      random:  { label: '🎲 완전 랜덤', desc: '아무 조건 없이 1~45에서 6개. 사실 수학적으로는 다른 방식과 확률이 똑같아요.' }
    };
    function load(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
    function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const isDark = () => document.documentElement.classList.contains('dark');
    const cls = n => n <= 10 ? 'b1' : n <= 20 ? 'b2' : n <= 30 ? 'b3' : n <= 40 ? 'b4' : 'b5';
    const COLOR = { b1: '#fbc400', b2: '#69c8f2', b3: '#ff7272', b4: '#aaaaaa', b5: '#b0d840' };
    const ball = (n, extra = '', delay) => `<span class="ball ${cls(n)} ${extra}"${delay != null ? ` style="animation-delay:${delay}ms"` : ''}>${n}</span>`;
    const won = n => n == null ? '-' : n >= 1e8 ? `${(n / 1e8).toFixed(1).replace(/\.0$/, '')}억원` : `${Math.round(n / 1e4).toLocaleString()}만원`;

    let draws = [], latest = null, mode = load('argon_lotto_mode', 'balance'), win = load('argon_lotto_win', 100), picks = [], chart = null, pastSet = new Set();
    if (!MODES[mode]) mode = 'balance';
    if (![50, 100, 0].includes(win)) win = 100;
    let mine = load(MINE_KEY, []);   // [{ id, nums, target(회차), savedAt, mode }]

    // ---------- 무작위 (암호학적 난수) ----------
    const rnd = () => crypto.getRandomValues(new Uint32Array(1))[0] / 2 ** 32;
    function weightedPick(weights) {   // weights[1..45] → 6개 비복원 추출
      const pool = []; for (let n = 1; n <= 45; n++) pool.push([n, Math.max(weights[n], 1e-9)]);
      const out = [];
      while (out.length < 6) {
        const total = pool.reduce((a, p) => a + p[1], 0); let r = rnd() * total, i = 0;
        while (r > pool[i][1] && i < pool.length - 1) { r -= pool[i][1]; i++; }
        out.push(pool[i][0]); pool.splice(i, 1);
      }
      return out.sort((a, b) => a - b);
    }
    const consecutive = s => s.filter((n, i) => i && n - s[i - 1] === 1).length;
    const balanced = s => { const odd = s.filter(n => n % 2).length, low = s.filter(n => n <= 22).length, sum = s.reduce((a, b) => a + b, 0); return odd >= 2 && odd <= 4 && low >= 2 && low <= 4 && sum >= 100 && sum <= 175 && consecutive(s) <= 1; };
    function generate() {
      const st = stats(), w = Array(46).fill(1);
      if (mode === 'hot') for (let n = 1; n <= 45; n++) w[n] = Math.pow(st.freq[n] + 1, 1.6);
      if (mode === 'cold') for (let n = 1; n <= 45; n++) w[n] = Math.pow(st.gap[n] + 1, 1.2);
      for (let tries = 0; tries < 2000; tries++) {
        const s = weightedPick(w);
        if (pastSet.has(s.join(','))) continue;                       // 지난 1등 조합은 빼기
        if (picks.some(p => p.nums.join() === s.join())) continue;
        if (mode === 'balance' && !balanced(s)) continue;
        return s;
      }
      return weightedPick(Array(46).fill(1));
    }

    // ---------- 통계 ----------
    function stats() {
      const list = win ? draws.slice(-win) : draws, freq = Array(46).fill(0), gap = Array(46).fill(draws.length), lastSeen = Array(46).fill(null);
      list.forEach(d => d.slice(2, 8).forEach(n => freq[n]++));
      for (let i = draws.length - 1; i >= 0; i--) draws[i].slice(2, 8).forEach(n => { if (lastSeen[n] == null) { lastSeen[n] = draws[i][0]; gap[n] = draws.length - 1 - i; } });
      const sums = list.map(d => d.slice(2, 8).reduce((a, b) => a + b, 0)), odds = list.map(d => d.slice(2, 8).filter(n => n % 2).length);
      return { list, freq, gap, avgSum: sums.reduce((a, b) => a + b, 0) / (sums.length || 1), oddMode: mostCommon(odds), consecShare: list.filter(d => consecutive(d.slice(2, 8)) > 0).length / (list.length || 1) };
    }
    function mostCommon(arr) { const c = {}; arr.forEach(x => c[x] = (c[x] || 0) + 1); return Object.entries(c).sort((a, b) => b[1] - a[1])[0]?.[0]; }
    function rankOf(nums, d) {
      const win6 = d.slice(2, 8), m = nums.filter(n => win6.includes(n)).length, bonus = nums.includes(d[8]);
      return m === 6 ? 1 : m === 5 && bonus ? 2 : m === 5 ? 3 : m === 4 ? 4 : m === 3 ? 5 : 0;
    }

    // ---------- 그리기 ----------
    // 맨 위: 고른 회차 당첨번호 (기본은 최신, ‹ › 또는 목록으로 지난 회차)
    let viewNo = null, openGroups = new Set();
    const RANK = ['낙첨', '🥇 1등', '🥈 2등', '🥉 3등', '4등 (5만원)', '5등 (5천원)'];
    const drawOf = no => draws.find(d => d[0] === no);
    function renderLatest(animate = true) {
      const box = document.getElementById('latest');
      if (!latest) { box.innerHTML = draws.length === 0 ? `<div class="skel" style="height:64px"></div>` : ''; return; }
      const no = viewNo || latest.no, d = drawOf(no) || [latest.no, latest.date, ...latest.nums, latest.bonus, latest.prize1, latest.winners1];
      const isLatest = no === latest.no, first = draws.length ? draws[0][0] : no;
      const prize = d[9] != null ? d[9] : (isLatest ? latest.prize1 : null), winners = d[10] != null ? d[10] : (isLatest ? latest.winners1 : null);
      const opts = draws.slice().reverse().map(x => `<option value="${x[0]}" ${x[0] === no ? 'selected' : ''}>${x[0]}회 (${x[1].replace(/-/g, '.')})</option>`).join('');
      const myList = mine.filter(m => m.target === no), best = myList.length ? Math.min(...myList.map(m => rankOf(m.nums, d)).map(r => r || 9)) : null;
      box.innerHTML = `<div class="flex items-center gap-1.5">
          <button type="button" onclick="viewDraw(${no - 1})" ${no <= first ? 'disabled' : ''} aria-label="이전 회차" class="w-8 h-8 rounded-lg bg-slate-100 text-slate-600 font-bold disabled:opacity-30">‹</button>
          <select id="drawSel" aria-label="회차 고르기" class="flex-1 min-w-0 border border-slate-200 rounded-lg px-2 py-1.5 bg-white font-bold text-slate-700">${opts}</select>
          <button type="button" onclick="viewDraw(${no + 1})" ${isLatest ? 'disabled' : ''} aria-label="다음 회차" class="w-8 h-8 rounded-lg bg-slate-100 text-slate-600 font-bold disabled:opacity-30">›</button>
        </div>
        <div class="flex items-center justify-between mt-2"><p class="text-xs font-bold text-slate-500">${no}회 당첨번호 <span class="text-slate-400 font-semibold">· ${d[1].replace(/-/g, '.')}</span></p>${isLatest ? '<span class="text-[10px] font-bold px-1.5 py-0.5 rounded-md bg-indigo-50 text-indigo-600">최신</span>' : `<button type="button" onclick="viewDraw(${latest.no})" class="text-[11px] font-bold text-indigo-600">최신 회차로 ↻</button>`}</div>
        <div class="flex items-center gap-1.5 mt-2 flex-wrap">${d.slice(2, 8).map((n, i) => ball(n, animate ? 'pop' : '', animate ? i * 80 : null)).join('')}<span class="text-slate-400 font-extrabold mx-0.5">+</span>${ball(d[8], animate ? 'pop' : '', animate ? 560 : null)}</div>
        ${prize ? `<p class="text-xs text-slate-500 mt-2">1등 <b class="text-slate-800">${winners}명</b> · 1인당 <b class="text-slate-800">${won(prize)}</b></p>` : ''}
        ${myList.length ? `<button type="button" onclick="openGroup(${no})" class="mt-2 text-[11px] font-bold px-2 py-1 rounded-full ${best <= 5 ? 'bg-amber-100 text-amber-700' : 'bg-slate-100 text-slate-500'}">⭐ 내 번호 ${myList.length}게임 · ${best <= 5 ? RANK[best] : '모두 낙첨'} ›</button>` : ''}`;
      document.getElementById('drawSel').onchange = e => viewDraw(+e.target.value);
      // 다음 추첨: 매주 토요일 20:35 (한국 시간)
      const now = new Date(), kst = new Date(now.getTime() + (now.getTimezoneOffset() + 540) * 60000);
      const next = new Date(kst); next.setHours(20, 35, 0, 0); next.setDate(kst.getDate() + ((6 - kst.getDay() + 7) % 7));
      if (next <= kst) next.setDate(next.getDate() + 7);
      const h = Math.floor((next - kst) / 36e5), dd = Math.floor(h / 24);
      document.getElementById('nextDraw').innerHTML = `다음 추첨 ${latest.no + 1}회<br>${dd ? `${dd}일 ${h % 24}시간` : `${h}시간 ${Math.floor((next - kst) / 6e4) % 60}분`} 남음`;
    }
    function viewDraw(no) {
      if (!latest || !draws.length) return;
      no = Math.max(draws[0][0], Math.min(latest.no, no));
      viewNo = no === latest.no ? null : no; renderLatest(true);
    }
    function openGroup(no) {
      openGroups.add(String(no)); renderMine();
      const el = document.querySelector(`[data-group="${no}"]`); if (el) el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'center' });
    }
    function renderModes() {
      document.getElementById('modes').innerHTML = Object.entries(MODES).map(([k, m]) => `<button type="button" data-mode="${k}" aria-pressed="${k === mode}" class="chip text-xs font-bold px-2.5 py-1.5 rounded-full border border-slate-200 bg-white text-slate-600">${m.label}</button>`).join('');
      document.getElementById('modeDesc').textContent = MODES[mode].desc;
      document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { mode = b.dataset.mode; save('argon_lotto_mode', mode); renderModes(); });
    }
    function tags(s) {
      const odd = s.filter(n => n % 2).length, sum = s.reduce((a, b) => a + b, 0), c = consecutive(s);
      return `홀${odd}:짝${6 - odd} · 합 ${sum}${c ? ` · 연속 ${c}쌍` : ''}`;
    }
    function renderPicks(animate) {
      const box = document.getElementById('picks');
      if (!picks.length) { box.innerHTML = `<p class="text-xs text-slate-400 text-center py-3">방식을 고르고 뽑기를 눌러보세요 🍀</p>`; return; }
      const target = latest ? latest.no + 1 : null;
      box.innerHTML = picks.map((p, i) => `<div class="bg-slate-50 border border-slate-100 rounded-xl p-2.5">
          <div class="flex items-center justify-between gap-2">
            <span class="text-[11px] font-extrabold text-slate-400 w-4">${'ABCDE'[i] || i + 1}</span>
            <div class="flex gap-1 flex-1 justify-center">${p.nums.map((n, j) => ball(n, 'sm' + (animate ? ' pop' : ''), animate ? i * 120 + j * 60 : null)).join('')}</div>
            <button type="button" onclick="saveMine(${i})" aria-label="이 번호 저장" class="text-lg px-1 ${p.saved ? 'text-amber-400' : 'text-slate-300 hover:text-amber-400'}">${p.saved ? '★' : '☆'}</button>
          </div>
          <p class="text-[10px] text-slate-400 text-center mt-1 num">${tags(p.nums)}</p>
        </div>`).join('') + (picks.some(p => !p.saved) && target ? `<button type="button" onclick="saveAll()" class="w-full text-xs font-bold text-indigo-600 py-1.5">★ 전부 ${target}회 내 번호로 저장</button>` : '');
    }
    // 내 번호: 회차별로 접어두고, 누르면 그 회차에 고른 번호를 펼침
    function renderMine() {
      const box = document.getElementById('mine');
      document.getElementById('mineCount').textContent = mine.length ? `${mine.length}게임` : '';
      if (!mine.length) { box.innerHTML = `<p class="text-xs text-slate-400">뽑은 번호에서 ☆를 누르면 여기 저장돼요. 추첨이 끝나면 자동으로 맞춰봐요.</p>`; return; }
      const byDraw = {}; draws.forEach(d => byDraw[d[0]] = d);
      const groups = {}; mine.forEach(m => (groups[m.target] = groups[m.target] || []).push(m));
      box.innerHTML = `<div class="divide-y divide-slate-100">` + Object.keys(groups).sort((a, b) => b - a).map(t => {
        const d = byDraw[t], list = groups[t], open = openGroups.has(t);
        const ranks = d ? list.map(m => rankOf(m.nums, d)) : [], best = ranks.filter(Boolean).sort()[0];
        const sub = d ? `${list.length}게임 · ${best ? RANK[best] : '모두 낙첨'}` : `${list.length}게임 · 추첨 전`;
        return `<div data-group="${t}">
          <button type="button" onclick="toggleGroup('${t}')" aria-expanded="${open}" class="w-full flex items-center justify-between gap-2 py-2.5 text-left">
            <span class="min-w-0"><span class="block text-xs font-extrabold ${d ? 'text-slate-700' : 'text-indigo-600'}">${t}회${d ? ' 결과' : ''} <span class="text-slate-400">${open ? '▴' : '▾'}</span></span><span class="block text-[10px] font-bold ${best ? 'text-amber-600' : 'text-slate-400'}">${sub}</span></span>
            ${d ? `<span class="flex gap-0.5 items-center shrink-0">${d.slice(2, 8).map(n => ball(n, 'sm')).join('')}<span class="text-slate-400 text-xs font-bold">+</span>${ball(d[8], 'sm')}</span>` : `<span class="text-[11px] font-bold text-slate-400 shrink-0">토요일 20:35 추첨</span>`}
          </button>
          ${open ? `<div class="pb-2">${list.map((m, i) => { const r = d ? ranks[i] : null; return `<div class="flex items-center gap-1.5 py-1.5 border-t border-slate-100">
              <div class="flex gap-1 flex-1">${m.nums.map(n => ball(n, 'sm' + (d && !d.slice(2, 8).includes(n) && n !== d[8] ? ' miss' : ''))).join('')}</div>
              ${r != null ? `<span class="text-[10px] font-extrabold px-1.5 py-0.5 rounded-md shrink-0 ${r ? 'bg-amber-100 text-amber-700' : 'bg-slate-100 text-slate-400'}">${RANK[r]}</span>` : ''}
              <button type="button" onclick="removeMine(${m.id})" aria-label="삭제" class="text-slate-300 hover:text-rose-500 font-bold px-1 shrink-0">✕</button>
            </div>`; }).join('')}</div>` : ''}
        </div>`;
      }).join('') + `</div>`;
    }
    function toggleGroup(t) { if (openGroups.has(t)) openGroups.delete(t); else openGroups.add(t); renderMine(); }
    function renderStats() {
      document.querySelectorAll('[data-win]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.win === win)));
      if (!draws.length) return;
      const st = stats(), nums = Array.from({ length: 45 }, (_, i) => i + 1);
      const hot = nums.slice().sort((a, b) => st.freq[b] - st.freq[a] || a - b).slice(0, 6);
      const cold = nums.slice().sort((a, b) => st.gap[b] - st.gap[a] || a - b).slice(0, 6);
      document.getElementById('hot').innerHTML = hot.map(n => `<span class="flex flex-col items-center">${ball(n, 'sm')}<span class="text-[9px] text-slate-400 num mt-0.5">${st.freq[n]}회</span></span>`).join('');
      document.getElementById('cold').innerHTML = cold.map(n => `<span class="flex flex-col items-center">${ball(n, 'sm')}<span class="text-[9px] text-slate-400 num mt-0.5">${st.gap[n]}주째</span></span>`).join('');
      const cell = (l, v) => `<div class="bg-slate-50 rounded-lg px-2 py-2 text-center"><p class="text-[10px] font-bold text-slate-400">${l}</p><p class="text-sm font-extrabold num text-slate-800">${v}</p></div>`;
      document.getElementById('facts').innerHTML = cell('평균 합계', Math.round(st.avgSum)) + cell('가장 흔한 홀짝', `홀${st.oddMode}:짝${6 - st.oddMode}`) + cell('연속번호 포함', `${Math.round(st.consecShare * 100)}%`);
      if (typeof Chart === 'undefined') return;
      const data = nums.map(n => st.freq[n]), colors = nums.map(n => COLOR[cls(n)]);
      if (chart) { chart.data.datasets[0].data = data; chart.update(); return; }
      chart = new Chart(document.getElementById('freqChart'), {
        type: 'bar', data: { labels: nums, datasets: [{ data, backgroundColor: colors, borderRadius: 3 }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { displayColors: false, callbacks: { title: c => `${c[0].label}번`, label: c => `${c.parsed.y}회 나옴` } } },
          scales: { x: { grid: { display: false }, ticks: { autoSkip: false, font: { size: 8 }, color: '#94a3b8', callback: (v, i) => (i + 1) % 5 === 0 || i === 0 ? i + 1 : '' } }, y: { grid: { color: isDark() ? 'rgba(148,163,184,.12)' : 'rgba(100,116,139,.12)' }, ticks: { font: { size: 9 }, color: '#94a3b8', maxTicksLimit: 4 } } } }
      });
    }

    // ---------- 동작 ----------
    function draw(n) {
      picks = [];
      for (let i = 0; i < n; i++) picks.push({ nums: generate(), saved: false });
      renderPicks(true);
    }
    function saveMine(i) {
      const p = picks[i]; if (!p || p.saved || !latest) return;
      mine.push({ id: Math.max(Date.now(), ...mine.map(m => m.id + 1)), nums: p.nums, target: latest.no + 1, savedAt: new Date().toISOString(), mode });
      p.saved = true; openGroups.add(String(latest.no + 1)); save(MINE_KEY, mine); renderPicks(false); renderMine();
    }
    function saveAll() { picks.forEach((p, i) => { if (!p.saved) saveMine(i); }); }
    function removeMine(id) { mine = mine.filter(m => m.id !== id); save(MINE_KEY, mine); renderMine(); renderLatest(false); }
    document.querySelectorAll('[data-win]').forEach(b => b.addEventListener('click', () => { win = +b.dataset.win; save('argon_lotto_win', win); renderStats(); }));

    function openSideNav() { document.getElementById('sideNav').classList.add('open'); document.getElementById('sideNavBackdrop').classList.add('open'); }
    function closeSideNav() { document.getElementById('sideNav').classList.remove('open'); document.getElementById('sideNavBackdrop').classList.remove('open'); }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSideNav(); });
    function toggleDark() {
      const on = !isDark(); document.documentElement.classList.toggle('dark', on);
      try { localStorage.setItem('argon_dark_mode', String(on)); } catch (e) {}
      document.getElementById('darkBtn').textContent = on ? '☀️ 라이트 모드' : '🌙 다크 모드';
      if (chart) { chart.destroy(); chart = null; } renderStats();
    }

    async function loadDraws() {
      try {
        const r = await fetch('./api/lotto');
        if (!r.ok || !(r.headers.get('content-type') || '').includes('json')) throw 0;
        const j = await r.json(); draws = j.draws || []; latest = j.latest;
        pastSet = new Set(draws.map(d => d.slice(2, 8).join(',')));
      } catch (e) {
        document.getElementById('latest').innerHTML = `<p class="text-sm text-slate-500">당첨번호를 불러오지 못했어요. 그래도 🎲 완전 랜덤 뽑기는 돼요.</p>`;
        draws = []; mode = 'random';
      }
      renderLatest(); renderModes(); renderStats(); renderMine(); renderPicks(false);
    }
    document.getElementById('darkBtn').textContent = isDark() ? '☀️ 라이트 모드' : '🌙 다크 모드';
    renderModes(); renderPicks(false); renderMine(); renderLatest();
    loadDraws();
  </script>
</body>
</html>
