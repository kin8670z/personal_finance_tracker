<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f1f5f9">
  <title>아르곤 주식 현황</title>
  <script>
    // 가계부와 같은 다크 모드 설정을 첫 화면부터 적용
    try { if (localStorage.getItem('argon_dark_mode') === 'true') document.documentElement.classList.add('dark'); } catch (e) {}
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    html, body { width: 100%; max-width: 100vw; min-height: 100dvh; overflow-x: hidden; font-family: 'Pretendard', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
    body { padding: max(0.5rem, env(safe-area-inset-top)) max(0.5rem, env(safe-area-inset-right)) max(2rem, env(safe-area-inset-bottom)) max(0.5rem, env(safe-area-inset-left)); }
    @media (min-width: 768px) { body { padding: 1.25rem 2rem 2rem 2rem; } }
    .card { background: white; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05); max-width: 100%; overflow: hidden; }
    input, select, button { font-size: 16px !important; }
    @media (min-width: 768px) { input, select, button { font-size: 0.875rem !important; } }
    .num { font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
    /* 한국식 색: 상승 빨강, 하락 파랑 */
    .up { color: #e11d48; } .down { color: #2563eb; } .flat { color: #64748b; }
    .pill-up { background: #fff1f2; color: #e11d48; } .pill-down { background: #eff6ff; color: #2563eb; } .pill-flat { background: #f1f5f9; color: #64748b; }
    .hero-up { background: linear-gradient(135deg, #fff1f2 0%, #ffffff 70%); } .hero-down { background: linear-gradient(135deg, #eff6ff 0%, #ffffff 70%); } .hero-flat { background: #fff; }
    .dark .hero-up { background: linear-gradient(135deg, #4c0519 0%, #1e293b 70%) !important; } .dark .hero-down { background: linear-gradient(135deg, #172554 0%, #1e293b 70%) !important; }
    .dark .up { color: #fb7185; } .dark .down { color: #60a5fa; }
    .dark .pill-up { background: #4c0519; color: #fda4af; } .dark .pill-down { background: #172554; color: #93c5fd; } .dark .pill-flat { background: #334155; color: #cbd5e1; }
    .tile { transition: transform .12s ease, box-shadow .12s ease; }
    .tile:active { transform: scale(.98); }
    .tile.sel { box-shadow: 0 0 0 2px #6366f1 inset; }
    .row:active { background: #f8fafc; }
    .dark .row:active { background: #0f172a; }
    .skel { background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%); background-size: 200% 100%; animation: sk 1.2s infinite; border-radius: .375rem; }
    .dark .skel { background: linear-gradient(90deg, #334155 25%, #1e293b 50%, #334155 75%); background-size: 200% 100%; }
    @keyframes sk { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .live-dot { width: 7px; height: 7px; border-radius: 9999px; background: #10b981; box-shadow: 0 0 0 0 rgba(16,185,129,.6); animation: pulse 1.8s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16,185,129,.55); } 70% { box-shadow: 0 0 0 7px rgba(16,185,129,0); } 100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); } }
    .flash-up { animation: fu 1s ease; } .flash-down { animation: fd 1s ease; }
    @keyframes fu { 0% { background: rgba(225,29,72,.18); } 100% { background: transparent; } }
    @keyframes fd { 0% { background: rgba(37,99,235,.18); } 100% { background: transparent; } }
    .chart-img { display: block; width: 100%; height: auto; background: #fff; border-radius: .5rem; }
    .dark .chart-img { filter: invert(.88) hue-rotate(180deg); }
    .chart-fail { font-size: 12px; color: #94a3b8; text-align: center; padding: 2rem .5rem; }
    .seg button[aria-pressed="true"] { background: #4f46e5; color: white; }
    .dark body { background-color: #0f172a !important; color: #f1f5f9 !important; }
    .dark .card { background-color: #1e293b !important; color: #f8fafc !important; border-color: #334155 !important; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3) !important; }
    .dark input, .dark select { background-color: #0f172a !important; color: #f8fafc !important; border-color: #334155 !important; }
    .dark .bg-white { background-color: #1e293b !important; }
    .dark .bg-white\/70 { background-color: rgba(51,65,85,.7) !important; color: #e2e8f0 !important; border-color: #475569 !important; }
    .dark .bg-slate-50 { background-color: #0f172a !important; border-color: #334155 !important; color: #cbd5e1 !important; }
    .dark .bg-slate-100 { background-color: #334155 !important; color: #cbd5e1 !important; }
    .dark .text-slate-800, .dark .text-slate-900 { color: #f8fafc !important; }
    .dark .text-slate-500, .dark .text-slate-600, .dark .text-slate-700 { color: #94a3b8 !important; }
    .dark .border-slate-200, .dark .border-slate-100 { border-color: #334155 !important; }
    .dark .divide-slate-100 > * + * { border-color: #334155 !important; }
    /* 사이드 메뉴 */
    #sideNav { transform: translateX(-100%); transition: transform .22s ease; }
    #sideNav.open { transform: translateX(0); }
    #sideNavBackdrop { opacity: 0; pointer-events: none; transition: opacity .2s ease; }
    #sideNavBackdrop.open { opacity: 1; pointer-events: auto; }
    .dark #sideNav { background-color: #1e293b !important; border-color: #334155 !important; }
    .nav-item.active { background-color: #eef2ff; color: #4338ca; }
    .dark .nav-item.active { background-color: #312e81; color: #e0e7ff; }
    .dark .nav-item:not(.active) { color: #cbd5e1; }
    @media (prefers-reduced-motion: reduce) { #sideNav, #sideNavBackdrop, .tile, .skel, .live-dot, .flash-up, .flash-down { transition: none; animation: none; } }
  </style>
</head>
<body class="text-slate-800">
  <!-- 사이드 메뉴 (가계부와 동일) -->
  <div id="sideNavBackdrop" onclick="closeSideNav()" class="fixed inset-0 bg-slate-900/40 z-40"></div>
  <nav id="sideNav" aria-label="페이지 이동" class="fixed top-0 left-0 bottom-0 w-64 max-w-[80vw] bg-white border-r border-slate-200 z-50 p-4 flex flex-col gap-1 shadow-xl" style="padding-top: max(1rem, env(safe-area-inset-top));">
    <div class="flex items-center justify-between mb-3"><p class="text-sm font-extrabold text-slate-900">아르곤</p><button type="button" onclick="closeSideNav()" class="text-slate-400 text-lg font-bold px-2" aria-label="메뉴 닫기">✕</button></div>
    <a href="./" class="nav-item flex items-center gap-2 px-3 py-2.5 rounded-xl text-sm font-bold text-slate-700 hover:bg-slate-100">📒 <span>가계부</span></a>
    <a href="./stocks.html" class="nav-item active flex items-center gap-2 px-3 py-2.5 rounded-xl text-sm font-bold">📈 <span>주식 현황</span></a>
    <div class="mt-auto pt-3 border-t border-slate-100"><button type="button" onclick="toggleDark()" id="darkBtn" class="w-full text-left px-3 py-2 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100">🌙 다크 모드</button></div>
  </nav>

  <div class="w-full max-w-7xl mx-auto space-y-3 md:space-y-4">
    <!-- 헤더 + 오늘 요약 -->
    <header id="hero" class="card hero-flat p-4 md:p-5">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2 min-w-0">
          <button type="button" onclick="openSideNav()" aria-label="메뉴 열기" class="w-9 h-9 flex items-center justify-center rounded-xl bg-white/70 border border-slate-200 text-slate-700 font-bold shrink-0">☰</button>
          <h1 class="text-base sm:text-lg md:text-xl font-extrabold text-slate-900 tracking-tight truncate">오늘의 주식 현황</h1>
        </div>
        <button type="button" onclick="refreshAll(true)" aria-label="새로고침" id="refreshBtn" class="w-9 h-9 flex items-center justify-center rounded-xl bg-white/70 border border-slate-200 text-slate-700 shrink-0">🔄</button>
      </div>
      <div class="flex items-center gap-1.5 mt-2 text-[11px] font-bold text-slate-500">
        <span id="liveDot" class="hidden live-dot"></span><span id="statusLabel">불러오는 중…</span>
      </div>
      <div id="summary" class="mt-3"></div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-5 gap-3 md:gap-4 items-start">
      <div class="lg:col-span-2 space-y-3 md:space-y-4">
        <!-- 시장 지수 -->
        <section class="card p-4">
          <div class="flex justify-between items-center gap-2 mb-3">
            <h2 class="text-sm md:text-base font-extrabold text-slate-900">🌏 시장 지수</h2>
            <div class="seg flex bg-slate-100 rounded-xl p-0.5 text-xs font-bold" role="group" aria-label="시장">
              <button type="button" data-market="kr" class="px-3 py-1.5 rounded-lg">국내</button>
              <button type="button" data-market="world" class="px-3 py-1.5 rounded-lg">해외</button>
            </div>
          </div>
          <div id="marketGrid" class="grid grid-cols-2 gap-2"></div>
          <p id="worldNote" class="text-[11px] text-slate-400 mt-2 hidden">미국 지수는 한국 시간 밤~새벽에 열려서, 낮에는 어젯밤 마감 기준이에요.</p>
        </section>

        <!-- 관심 종목 -->
        <section class="card p-4">
          <div class="flex justify-between items-center gap-2 mb-1">
            <h2 class="text-sm md:text-base font-extrabold text-slate-900">⭐ 관심 종목 <span id="watchCount" class="text-xs text-indigo-600 font-bold"></span></h2>
            <button type="button" id="editBtn" onclick="toggleEdit()" class="text-xs font-bold text-slate-500 px-2 py-1 rounded-lg hover:bg-slate-100">편집</button>
          </div>
          <div id="watchList" class="divide-y divide-slate-100"></div>
          <form id="addForm" class="mt-3 relative" autocomplete="off">
            <div class="flex gap-2">
              <input id="addInput" placeholder="종목 이름·코드 검색 (예: 카카오)" maxlength="30" class="flex-1 min-w-0 border border-slate-200 rounded-xl px-3 py-2 bg-white" aria-label="추가할 종목 검색" aria-autocomplete="list" aria-controls="suggest">
              <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shrink-0">추가</button>
            </div>
            <ul id="suggest" role="listbox" class="hidden absolute left-0 right-0 mt-1 bg-white border border-slate-200 rounded-xl shadow-lg z-30 max-h-64 overflow-auto text-sm"></ul>
          </form>
          <p id="addMsg" class="text-xs text-rose-600 mt-1.5 hidden"></p>
        </section>
      </div>

      <!-- 상세 차트 -->
      <section id="detailSection" class="card p-4 md:p-5 lg:col-span-3 lg:sticky lg:top-4">
        <div id="detailHead"></div>
        <div class="mt-3 mb-2">
          <div class="seg grid grid-cols-5 bg-slate-100 rounded-xl p-0.5 text-xs font-bold whitespace-nowrap" role="group" aria-label="기간" id="rangeSeg">
            <button type="button" data-range="1d" class="px-2.5 py-1.5 rounded-lg">1일</button>
            <button type="button" data-range="1m" class="px-2.5 py-1.5 rounded-lg">1개월</button>
            <button type="button" data-range="3m" class="px-2.5 py-1.5 rounded-lg">3개월</button>
            <button type="button" data-range="1y" class="px-2.5 py-1.5 rounded-lg">1년</button>
            <button type="button" data-range="3y" class="px-2.5 py-1.5 rounded-lg">3년</button>
          </div>
          <p id="periodChange" class="text-xs font-bold num text-right mt-1.5 min-h-[1rem]"></p>
        </div>
        <div id="detailChartBox" class="relative h-[260px] md:h-[360px]"><canvas id="detailChart" aria-label="가격 차트"></canvas></div>
        <div id="detailMeta" class="grid grid-cols-4 gap-2 mt-3"></div>
        <a id="detailLink" href="#" target="_blank" rel="noopener" class="block text-center text-xs font-bold text-indigo-600 mt-3">네이버 증권에서 더 보기 ↗</a>
      </section>
    </div>

    <p class="text-[11px] text-slate-400 text-center px-2 leading-relaxed">시세는 네이버 증권·야후 파이낸스의 공개 데이터예요. 화면을 보고 있는 동안 30초마다 새로 불러오고,<br class="hidden sm:inline"> 실제 거래 가격과 조금 다를 수 있어요. 투자 판단은 증권사 앱에서 꼭 다시 확인하세요.</p>
  </div>

  <script>
    const WATCH_KEY = 'argon_watchlist_v1';
    const API = './api/stock';
    const IMG = 'https://ssl.pstatic.net/imgfinance/chart';
    const DEFAULT_WATCH = [
      { id: 1, name: '삼성전자', symbol: 'KRX:005930' },
      { id: 2, name: 'SK하이닉스', symbol: 'KRX:000660' }
    ];
    // 화면에 쓰는 대상 표기: KRX:종목코드 / IDX:KOSPI / WLD:.DJI / FX:USD
    const KR_MARKETS = [['IDX:KOSPI', '코스피'], ['IDX:KOSDAQ', '코스닥'], ['FX:USD', '원/달러']];
    const WORLD_MARKETS = [['WLD:.DJI', '다우존스'], ['WLD:.IXIC', '나스닥'], ['WLD:.INX', 'S&P 500'], ['WLD:.SOX', '필라델피아 반도체'], ['WLD:.N225', '니케이 225'], ['WLD:.SSEC', '상해 종합'], ['WLD:.HSI', '항셍']];
    const IMG_SRC = {
      'IDX:KOSPI': `${IMG}/main/KOSPI.png`, 'IDX:KOSDAQ': `${IMG}/main/KOSDAQ.png`, 'FX:USD': `${IMG}/marketindex/area/month/FX_USDKRW.png`,
      'WLD:.DJI': `${IMG}/world/continent/DJI@DJI.png`, 'WLD:.IXIC': `${IMG}/world/continent/NAS@IXIC.png`, 'WLD:.INX': `${IMG}/world/continent/SPI@SPX.png`,
      'WLD:.SOX': `${IMG}/world/continent/NAS@SOX.png`, 'WLD:.N225': `${IMG}/world/continent/NII@NI225.png`, 'WLD:.SSEC': `${IMG}/world/continent/SHS@000001.png`, 'WLD:.HSI': `${IMG}/world/continent/HSI@HSI.png`
    };
    const NAVER_URL = {
      'IDX:KOSPI': 'https://finance.naver.com/sise/sise_index.naver?code=KOSPI', 'IDX:KOSDAQ': 'https://finance.naver.com/sise/sise_index.naver?code=KOSDAQ',
      'FX:USD': 'https://finance.naver.com/marketindex/exchangeDetail.naver?marketindexCd=FX_USDKRW',
      'WLD:.DJI': 'DJI@DJI', 'WLD:.IXIC': 'NAS@IXIC', 'WLD:.INX': 'SPI@SPX', 'WLD:.SOX': 'NAS@SOX', 'WLD:.N225': 'NII@NI225', 'WLD:.SSEC': 'SHS@000001', 'WLD:.HSI': 'HSI@HSI'
    };
    const RANGES = ['1d', '1m', '3m', '1y', '3y'];
    const RANGE_TEXT = { '1d': '오늘', '1m': '1개월', '3m': '3개월', '1y': '1년', '3y': '3년' };

    function load(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
    function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

    let watch = load(WATCH_KEY, null) || DEFAULT_WATCH.slice();
    let market = load('argon_watch_market_v1', 'kr'); if (!['kr', 'world'].includes(market)) market = 'kr';
    let range = load('argon_watch_range_v2', '1d'); if (!RANGES.includes(range)) range = '1d';
    let target = load('argon_watch_detail_v1', null) || (watch[0] ? watch[0].symbol : 'IDX:KOSPI');
    let quotes = {}, sparks = {}, apiOk = null, lastAt = 0, editing = false, chart = null, chartReq = 0, loading = false;

    const isDark = () => document.documentElement.classList.contains('dark');
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const kind = t => t.startsWith('KRX:') ? 'kr' : t.startsWith('IDX:') ? 'idx' : t.startsWith('WLD:') ? 'world' : t.startsWith('FX:') ? 'fx' : null;
    const codeOf = t => t.slice(t.indexOf(':') + 1);
    const keyOf = t => `${kind(t)}:${codeOf(t)}`;
    const isKrStock = t => /^KRX:[0-9A-Z]{6}$/.test(t);
    const nameOf = t => { const w = watch.find(x => x.symbol === t); if (w) return w.name; const m = [...KR_MARKETS, ...WORLD_MARKETS].find(x => x[0] === t); return m ? m[1] : (quotes[keyOf(t)] || {}).name || codeOf(t); };
    const naverUrl = t => kind(t) === 'kr' ? `https://finance.naver.com/item/main.naver?code=${codeOf(t)}` : kind(t) === 'world' ? `https://finance.naver.com/world/sise.naver?symbol=${NAVER_URL[t]}` : NAVER_URL[t] || 'https://finance.naver.com/';
    const digits = t => kind(t) === 'kr' ? 0 : 2;
    const fmt = (n, d = 0) => n == null || isNaN(n) ? '-' : Number(n).toLocaleString('ko-KR', { minimumFractionDigits: d, maximumFractionDigits: d });
    const dirOf = n => n > 0 ? 'up' : n < 0 ? 'down' : 'flat';
    const arrow = d => d === 'up' ? '▲' : d === 'down' ? '▼' : '';
    const rateText = r => r == null ? '-' : `${r > 0 ? '+' : ''}${Number(r).toFixed(2)}%`;
    const COLORS = { up: '#e11d48', down: '#2563eb', flat: '#64748b' };
    const DARK_COLORS = { up: '#fb7185', down: '#60a5fa', flat: '#94a3b8' };
    const color = d => (isDark() ? DARK_COLORS : COLORS)[d] || COLORS.flat;
    function shortVol(n) { if (n == null) return '-'; if (n >= 1e8) return (n / 1e8).toFixed(1) + '억'; if (n >= 1e4) return Math.round(n / 1e4).toLocaleString() + '만'; return n.toLocaleString(); }

    // ---------- 미니 그래프 (SVG) ----------
    function spark(t, h = 36) {
      const s = sparks[keyOf(t)], q = quotes[keyOf(t)];
      if (!s || !s.p || s.p.length < 2) return `<div style="height:${h}px"></div>`;
      const pts = s.p, base = s.prev != null ? s.prev : (q && q.price != null && q.change != null ? q.price - q.change : pts[0]);
      const lo = Math.min(...pts, base), hi = Math.max(...pts, base), span = (hi - lo) || 1;
      const W = 100, H = 32, y = v => (H - 2) - ((v - lo) / span) * (H - 4);
      const xy = pts.map((v, i) => `${(i / (pts.length - 1) * W).toFixed(2)},${y(v).toFixed(2)}`).join(' ');
      const d = q ? q.dir : dirOf(pts[pts.length - 1] - base), c = color(d), gid = 'g' + Math.random().toString(36).slice(2, 8);
      return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:${h}px;display:block" aria-hidden="true">
        <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".28"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs>
        <line x1="0" x2="${W}" y1="${y(base).toFixed(2)}" y2="${y(base).toFixed(2)}" stroke="${isDark() ? '#475569' : '#cbd5e1'}" stroke-width=".6" stroke-dasharray="2 2" vector-effect="non-scaling-stroke"/>
        <polygon points="0,${H} ${xy} ${W},${H}" fill="url(#${gid})"/>
        <polyline points="${xy}" fill="none" stroke="${c}" stroke-width="1.6" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
      </svg>`;
    }
    const img = (src, alt) => `<img class="chart-img" src="${src}?t=${lastAt || Date.now()}" alt="${esc(alt)}" onerror="this.outerHTML='<p class=&quot;chart-fail&quot;>차트를 불러오지 못했어요</p>'">`;
    const skel = (w, h) => `<span class="skel inline-block" style="width:${w};height:${h}px"></span>`;

    // ---------- 데이터 ----------
    async function fetchQuotes() {
      const kr = watch.filter(w => isKrStock(w.symbol)).map(w => codeOf(w.symbol));
      const params = new URLSearchParams({ op: 'quotes', kr: kr.join(','), idx: 'KOSPI,KOSDAQ', world: WORLD_MARKETS.map(m => codeOf(m[0])).join(','), fx: '1', spark: '1' });
      const r = await fetch(`${API}?${params}`, { cache: 'no-store' });
      const ct = r.headers.get('content-type') || '';
      if (!r.ok || !ct.includes('json')) throw new Error('quotes ' + r.status);
      return r.json();
    }
    async function refreshAll(manual) {
      if (loading) return; loading = true;
      const btn = document.getElementById('refreshBtn'); btn.style.opacity = '.5';
      const prev = quotes;
      try {
        const j = await fetchQuotes();
        const next = {};
        [['kr', j.kr], ['idx', j.idx], ['world', j.world], ['fx', j.fx]].forEach(([k, arr]) => (arr || []).forEach(q => { next[`${k}:${q.id}`] = q; }));
        quotes = next; sparks = j.spark || {}; apiOk = true; lastAt = Date.now();

    function renderDetailHead() {

          <p class="text-sm font-bold num ${q.dir}">${arrow(q.dir)} ${fmt(Math.abs(q.change), digits(t))} (${rateText(q.rate)}) <span class="text-[11px] text-slate-400 font-semibold">${q.status === 'CLOSE' ? '마감 기준' : '전일 대비'}</span></p>`

    // 아래 4칸: 1일은 오늘 시세, 다른 기간은 그 기간의 시작가·최고가·최저가·평균 거래량
    let periodStats = null;   // { target, range, stats }

        if (k === 'kr' && ps.avgVolume != null) html += cell(range === '3y' ? '주 평균 거래량' : '일 평균 거래량', shortVol(ps.avgVolume));

    function renderAll(prev) { renderStatus(); renderSummary(); renderMarkets(prev); renderWatch(prev); renderDetailHead(); }

    // ---------- 상세 차트 (Chart.js) ----------
    function timeLabel(ms) {
      const d = new Date(ms);
      if (range === '1d') {
        if (kind(target) === 'world') return d.toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
        return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
      }
      return range === '3y' || range === '1y' ? `${String(d.getFullYear()).slice(2)}.${d.getMonth() + 1}.${d.getDate()}` : `${d.getMonth() + 1}/${d.getDate()}`;
    }
    async function loadChart() {
      document.querySelectorAll('[data-range]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.range === range)));
      const box = document.getElementById('detailChartBox'), t = target, my = ++chartReq;
      if (apiOk === false || typeof Chart === 'undefined') {

        const src = kind(t) === 'kr' ? `${IMG}/item/candle/${range === '3y' ? 'month' : range === '1y' ? 'week' : 'day'}/${codeOf(t)}.png` : IMG_SRC[t];
        box.style.height = 'auto'; box.innerHTML = src ? img(src, nameOf(t)) : '<p class="chart-fail">차트를 불러오지 못했어요</p>';

      if (!box.querySelector('canvas')) { box.style.height = ''; box.innerHTML = '<canvas id="detailChart" aria-label="가격 차트"></canvas>'; }
      let data;
      try {
        const r = await fetch(`${API}?op=chart&kind=${kind(t)}&code=${encodeURIComponent(codeOf(t))}&range=${range}`);
        if (!r.ok) throw new Error(r.status);
        data = await r.json();
      } catch (e) { data = { points: [] }; }
      if (my !== chartReq) return;   // 그사이 다른 종목·기간을 고름
      const pts = data.points || [], q = quotes[keyOf(t)];
      periodStats = { target: t, range, stats: data.stats || null };
      renderMeta();
      if (pts.length < 2) {
        if (chart) { chart.destroy(); chart = null; }
        box.innerHTML = '<p class="chart-fail" style="padding-top:6rem">차트 데이터가 아직 없어요</p>';
        document.getElementById('periodChange').textContent = '';
        return;
      }
      let base = range === '1d' ? (data.prevClose ?? (q && q.price != null && q.change != null ? q.price - q.change : pts[0][1])) : pts[0][1];
      const last = pts[pts.length - 1][1], ch = (last - base) / base * 100, d = dirOf(Math.round(ch * 100));
      const pc = document.getElementById('periodChange');
      pc.className = `text-xs font-bold num text-right mt-1.5 min-h-[1rem] ${d}`;
      pc.textContent = range === '1d' ? '' : `${RANGE_TEXT[range]} 동안 ${arrow(d)} ${rateText(ch)}`;   // 1일은 위 등락률과 같아서 생략
      const c = color(d), grid = isDark() ? 'rgba(148,163,184,.12)' : 'rgba(100,116,139,.12)', tick = isDark() ? '#94a3b8' : '#94a3b8';
      const canvas = box.querySelector('canvas'), ctx = canvas.getContext('2d');
      const grad = ctx.createLinearGradient(0, 0, 0, box.clientHeight || 300);
      grad.addColorStop(0, c + '55'); grad.addColorStop(1, c + '00');
      const labels = pts.map(p => timeLabel(p[0])), dg = digits(t);
      const datasets = [{ data: pts.map(p => p[1]), borderColor: c, backgroundColor: grad, fill: true, borderWidth: 2, pointRadius: 0, pointHoverRadius: 4, pointHoverBackgroundColor: c, tension: .15 }];
      if (range === '1d') datasets.push({ data: pts.map(() => base), borderColor: isDark() ? '#64748b' : '#94a3b8', borderDash: [4, 4], borderWidth: 1, pointRadius: 0, pointHoverRadius: 0, fill: false, label: '전일 종가' });

          } },

    // ---------- 동작 ----------

    // 종목 검색 (이름 또는 코드)
    let sugTimer = null, sugItems = [], sugIdx = -1;
    const sugBox = document.getElementById('suggest'), addInput = document.getElementById('addInput');
    function hideSuggest() { sugBox.classList.add('hidden'); sugItems = []; sugIdx = -1; addInput.setAttribute('aria-expanded', 'false'); }
    function drawSuggest() {
      if (!sugItems.length) { sugBox.innerHTML = '<li class="px-3 py-2.5 text-xs text-slate-400">검색 결과가 없어요</li>'; }
      else sugBox.innerHTML = sugItems.map((s, i) => `<li role="option" aria-selected="${i === sugIdx}" data-i="${i}" class="px-3 py-2.5 flex justify-between gap-2 cursor-pointer ${i === sugIdx ? 'bg-indigo-50' : 'hover:bg-slate-50'}"><span class="font-bold text-slate-800 truncate">${esc(s.name)}</span><span class="text-[11px] text-slate-400 shrink-0">${esc(s.code)} · ${esc(s.market)}</span></li>`).join('');

    addInput.addEventListener('input', () => {
      clearTimeout(sugTimer);
      const q = addInput.value.trim();
      if (!q || apiOk === false) return hideSuggest();
      sugTimer = setTimeout(async () => {
        try {
          const r = await fetch(`${API}?op=search&q=${encodeURIComponent(q)}`); if (!r.ok) throw 0;
          const j = await r.json(); if (addInput.value.trim() !== q) return;
          sugItems = j.items || []; sugIdx = sugItems.length ? 0 : -1; drawSuggest();
        } catch (e) { hideSuggest(); }
      }, 220);
    });
    addInput.addEventListener('keydown', e => {
      if (sugBox.classList.contains('hidden') || !sugItems.length) { if (e.key === 'Escape') hideSuggest(); return; }
      if (e.key === 'ArrowDown') { e.preventDefault(); sugIdx = (sugIdx + 1) % sugItems.length; drawSuggest(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); sugIdx = (sugIdx - 1 + sugItems.length) % sugItems.length; drawSuggest(); }
      else if (e.key === 'Escape') hideSuggest();
    });
    sugBox.addEventListener('mousedown', e => { const li = e.target.closest('[data-i]'); if (!li) return; e.preventDefault(); const s = sugItems[+li.dataset.i]; addWatch(s.code, s.name); });
    addInput.addEventListener('blur', () => setTimeout(hideSuggest, 150));
    document.getElementById('addForm').addEventListener('submit', e => {
      e.preventDefault();
      const msg = document.getElementById('addMsg'), v = addInput.value.trim().toUpperCase().replace(/^KRX:/, '');
      if (sugItems.length && sugIdx >= 0) { const s = sugItems[sugIdx]; return addWatch(s.code, s.name); }
      if (/^[0-9A-Z]{6}$/.test(v)) return addWatch(v, '');
      msg.textContent = apiOk === false ? '종목코드 6자리로 넣어주세요. (예: 카카오 035720)' : '목록에서 종목을 골라주세요. 이름이나 6자리 코드로 검색돼요.';
      msg.classList.remove('hidden');
    });

    document.querySelectorAll('[data-market]').forEach(b => b.addEventListener('click', () => { market = b.dataset.market; save('argon_watch_market_v1', market); renderMarkets(); }));
    document.querySelectorAll('[data-range]').forEach(b => b.addEventListener('click', () => { range = b.dataset.range; save('argon_watch_range_v2', range); renderMeta(); loadChart(); }));

    function openSideNav() { document.getElementById('sideNav').classList.add('open'); document.getElementById('sideNavBackdrop').classList.add('open'); }
    function closeSideNav() { document.getElementById('sideNav').classList.remove('open'); document.getElementById('sideNavBackdrop').classList.remove('open'); }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSideNav(); });
    function toggleDark() {
      const on = !isDark(); document.documentElement.classList.toggle('dark', on);
      try { localStorage.setItem('argon_dark_mode', String(on)); } catch (e) {}
      document.getElementById('darkBtn').textContent = on ? '☀️ 라이트 모드' : '🌙 다크 모드';
      renderAll(); loadChart();
    }

    // 화면을 보고 있을 때만 30초마다 새로고침
    setInterval(() => { if (document.visibilityState === 'visible') refreshAll(false); }, 30000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - lastAt > 20000) refreshAll(false); });

    document.getElementById('darkBtn').textContent = isDark() ? '☀️ 라이트 모드' : '🌙 다크 모드';
    if (load(WATCH_KEY, null) === null) save(WATCH_KEY, watch);
    renderAll();
    refreshAll(true);
  </script>
</body>
</html>
