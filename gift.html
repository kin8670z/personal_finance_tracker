  <script>
    const KEY = 'argon_gift_v1', IMG_KEY = 'gift_images_v1';   // 사진은 argon_ 이 아니라 기기 동기화 안 함
    function load(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
    function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const isDark = () => document.documentElement.classList.contains('dark');
    const pad = n => String(n).padStart(2, '0');
    const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const dateOf = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
    const daysLeft = s => Math.round((dateOf(s) - dateOf(ymd(new Date()))) / 864e5);

    let st = Object.assign({ items: [] }, load(KEY, {}));
    let imgs = load(IMG_KEY, {});
    let editId = null, pendingImg = null, oldOpen = false;
    const persist = () => save(KEY, st);

    // 사진: 긴 변 1000px JPEG로 줄여서 저장 (바코드가 읽힐 정도)
    function shrink(file) {
      return new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => { const im = new Image(); im.onload = () => {
          const k = Math.min(1, 1000 / Math.max(im.width, im.height)), c = document.createElement('canvas');
          c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
          const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
          res(c.toDataURL('image/jpeg', 0.8));
        }; im.onerror = rej; im.src = r.result; };
        r.onerror = rej; r.readAsDataURL(file);
      });
    }
    document.getElementById('fImg').addEventListener('change', async e => {
      const f = e.target.files[0]; if (!f) return;
      try { pendingImg = await shrink(f); const p = document.getElementById('fPreview'); p.src = pendingImg; p.classList.remove('hidden'); document.getElementById('fImgHint').textContent = '사진 바꾸기'; } catch (err) { alert('사진을 읽지 못했어요.'); }
    });
    function openForm(id) {
      editId = id || null; pendingImg = null;
      const it = id ? st.items.find(x => x.id === id) : null;
      document.getElementById('formTitle').textContent = it ? '✏️ 기프티콘 수정' : '🎁 기프티콘 추가';
      document.getElementById('fName').value = it ? it.name : ''; document.getElementById('fStore').value = it ? it.store || '' : '';
      document.getElementById('fExp').value = it ? it.exp : ymd(new Date(Date.now() + 90 * 864e5));
      document.getElementById('fCode').value = it ? it.code || '' : ''; document.getElementById('fFrom').value = it ? it.from || '' : '';
      const p = document.getElementById('fPreview'); if (it && imgs[it.id]) { p.src = imgs[it.id]; p.classList.remove('hidden'); } else p.classList.add('hidden');
      document.getElementById('fImgHint').textContent = it && imgs[it.id] ? '사진 바꾸기' : '📷 기프티콘 사진·캡처 고르기';
      document.getElementById('fImg').value = '';
      document.getElementById('formSec').classList.remove('hidden'); closeViewer();
      document.getElementById('formSec').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    function closeForm() { document.getElementById('formSec').classList.add('hidden'); editId = null; pendingImg = null; }
    document.getElementById('form').addEventListener('submit', e => {
      e.preventDefault();
      const data = { name: document.getElementById('fName').value.trim(), store: document.getElementById('fStore').value.trim(), exp: document.getElementById('fExp').value, code: document.getElementById('fCode').value.trim(), from: document.getElementById('fFrom').value.trim() };
      if (!data.name || !data.exp) return;
      let id = editId;
      if (id) Object.assign(st.items.find(x => x.id === id), data);
      else { id = Math.max(Date.now(), ...st.items.map(x => x.id + 1)); st.items.push(Object.assign({ id, used: false, at: Date.now() }, data)); }
      if (pendingImg) { imgs[id] = pendingImg; if (!save(IMG_KEY, imgs)) { delete imgs[id]; alert('폰 저장 공간이 부족해서 사진은 저장하지 못했어요. 쓴 기프티콘을 지워 보세요.'); } }
      persist(); closeForm(); render();
    });
    function setUsed(id, v) { const it = st.items.find(x => x.id === id); if (!it) return; it.used = v; it.usedAt = v ? Date.now() : null; persist(); closeViewer(); render(); }
    function delItem(id) {
      if (!confirmDel(id)) return;
      st.items = st.items.filter(x => x.id !== id); delete imgs[id]; save(IMG_KEY, imgs); persist(); closeViewer(); render();
    }
    let delArm = null;
    function confirmDel(id) { if (delArm === id) { delArm = null; return true; } delArm = id; const b = document.getElementById('delBtn'); if (b) b.textContent = '한 번 더 누르면 삭제'; return false; }

    function badge(it) {
      if (it.used) return `<span class="text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-slate-200 text-slate-500">사용함</span>`;
      const n = daysLeft(it.exp);
      return `<span class="text-[10px] font-extrabold px-1.5 py-0.5 rounded-full ${n < 0 ? 'bg-slate-200 text-slate-500' : n <= 7 ? 'bg-rose-100 text-rose-600' : n <= 30 ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700'}">${n < 0 ? '만료' : n === 0 ? '오늘까지!' : `D-${n}`}</span>`;
    }
    function tile(it) {
      return `<div role="button" tabindex="0" onclick="view(${it.id})" class="cursor-pointer rounded-xl bg-slate-50 overflow-hidden ${it.used || daysLeft(it.exp) < 0 ? 'opacity-60' : ''}">
          <div class="aspect-[4/3] bg-slate-200 flex items-center justify-center overflow-hidden">${imgs[it.id] ? `<img src="${imgs[it.id]}" alt="" class="w-full h-full object-cover object-top">` : '<span class="text-4xl">🎁</span>'}</div>
          <div class="p-2"><div class="flex items-center justify-between gap-1">${badge(it)}<span class="text-[10px] text-slate-400 truncate">${esc(it.store || '')}</span></div>
          <p class="text-xs font-extrabold text-slate-800 mt-1 truncate">${esc(it.name)}</p><p class="text-[10px] text-slate-400">${it.exp.replace(/-/g, '.')}까지</p></div></div>`;
    }
    function render() {
      const active = st.items.filter(x => !x.used && daysLeft(x.exp) >= 0).sort((a, b) => a.exp.localeCompare(b.exp));
      const old = st.items.filter(x => x.used || daysLeft(x.exp) < 0).sort((a, b) => (b.usedAt || dateOf(b.exp).getTime()) - (a.usedAt || dateOf(a.exp).getTime()));
      const soon = active.filter(x => daysLeft(x.exp) <= 7).length;
      document.getElementById('sub').textContent = active.length ? `쓸 수 있는 것 ${active.length}개${soon ? ` · ⏰ 7일 안에 만료 ${soon}개` : ''}` : '받은 기프티콘을 저장해 두세요';
      document.getElementById('list').innerHTML = active.length ? `<div class="grid grid-cols-2 sm:grid-cols-3 gap-2">${active.map(tile).join('')}</div>`
        : `<div class="text-center py-8"><p class="text-4xl">🎁</p><p class="text-sm font-bold text-slate-600 mt-2">저장된 기프티콘이 없어요</p><p class="text-xs text-slate-400 mt-1">카톡으로 받은 기프티콘 캡처를 위의 ＋ 추가로 넣어보세요</p></div>`;
      const sec = document.getElementById('oldSec'); sec.classList.toggle('hidden', !old.length);
      document.getElementById('oldTitle').textContent = `사용함·만료 ${old.length}개`;
      document.getElementById('oldList').innerHTML = `<div class="grid grid-cols-3 gap-2">${old.map(tile).join('')}</div>`;
    }
    function toggleOld() { oldOpen = !oldOpen; document.getElementById('oldList').classList.toggle('hidden', !oldOpen); document.getElementById('oldArrow').textContent = oldOpen ? '접기 ▴' : '펼치기 ▾'; }
    function view(id) {
      const it = st.items.find(x => x.id === id); if (!it) return; delArm = null;
      const n = daysLeft(it.exp);
      document.getElementById('viewerBox').innerHTML = `
        <div class="flex items-center justify-between mb-2"><p class="text-base font-extrabold text-slate-900 truncate">${esc(it.name)}</p><span role="button" tabindex="0" onclick="closeViewer()" class="cursor-pointer text-slate-400 text-xl px-1" aria-label="닫기">✕</span></div>
        <p class="text-xs text-slate-500 mb-2">${esc(it.store || '')}${it.from ? ` · ${esc(it.from)}님이 보냄` : ''} · ${it.exp.replace(/-/g, '.')}까지 ${badge(it)}</p>
        ${imgs[it.id] ? `<img src="${imgs[it.id]}" alt="${esc(it.name)}" class="w-full rounded-xl bg-white">` : '<div class="py-10 text-center text-5xl bg-slate-50 rounded-xl">🎁</div>'}
        ${it.code ? `<p class="text-center text-lg font-extrabold tracking-widest num text-slate-900 mt-3 select-all">${esc(it.code.replace(/(\d{4})(?=\d)/g, '$1 '))}</p>` : ''}
        <p class="text-[10px] text-slate-400 text-center mt-1">계산할 때 화면 밝기를 올리면 바코드가 잘 찍혀요</p>
        <div class="grid grid-cols-3 gap-2 mt-3">
          <span role="button" tabindex="0" id="delBtn" onclick="delItem(${it.id})" class="cursor-pointer py-2 text-center rounded-xl bg-rose-50 text-rose-600 font-bold text-xs">삭제</span>
          <span role="button" tabindex="0" onclick="openForm(${it.id})" class="cursor-pointer py-2 text-center rounded-xl bg-slate-100 text-slate-600 font-bold text-xs">수정</span>
          ${it.used ? `<span role="button" tabindex="0" onclick="setUsed(${it.id}, false)" class="cursor-pointer py-2 text-center rounded-xl bg-slate-100 text-slate-600 font-bold text-xs">안 쓴 걸로</span>`
            : `<span role="button" tabindex="0" onclick="setUsed(${it.id}, true)" class="cursor-pointer py-2 text-center rounded-xl text-white font-bold text-xs" style="background:#059669">✅ 사용 완료</span>`}
        </div>`;
      const v = document.getElementById('viewer'); v.classList.remove('hidden'); v.classList.add('flex');
    }
    function closeViewer() { const v = document.getElementById('viewer'); v.classList.add('hidden'); v.classList.remove('flex'); }
    document.getElementById('viewer').addEventListener('click', e => { if (e.target.id === 'viewer') closeViewer(); });

    function openSideNav() { document.getElementById('sideNav').classList.add('open'); document.getElementById('sideNavBackdrop').classList.add('open'); }
    function closeSideNav() { document.getElementById('sideNav').classList.remove('open'); document.getElementById('sideNavBackdrop').classList.remove('open'); }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeSideNav(); closeViewer(); } });
    function toggleDark() {
      const on = !isDark(); document.documentElement.classList.toggle('dark', on);
      try { localStorage.setItem('argon_dark_mode', String(on)); } catch (e) {}
      document.getElementById('darkBtn').textContent = on ? '☀️ 라이트 모드' : '🌙 다크 모드';
    }
    document.getElementById('darkBtn').textContent = isDark() ? '☀️ 라이트 모드' : '🌙 다크 모드';
    window.addEventListener('storage', e => { if (e.key === KEY) { st = Object.assign({ items: [] }, load(KEY, {})); render(); } });
    render();
    const qv = Number(new URLSearchParams(location.search).get('id')); if (qv) view(qv);
  </script>
</body>
</html>
