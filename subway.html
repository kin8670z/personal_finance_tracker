<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f1f5f9">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="아르곤 자산관리">
  <script src="pwa.js" defer></script>
  <script src="sync.js" defer></script>
  <title>지하철 · 아르곤 자산관리</title>
  <script>
    // 가계부와 같은 다크 모드 설정을 첫 화면부터 적용
    try { if (localStorage.getItem('argon_dark_mode') === 'true') document.documentElement.classList.add('dark'); } catch (e) {}
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    html, body { width: 100%; max-width: 100vw; min-height: 100dvh; overflow-x: hidden; font-family: 'Pretendard', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
    body { padding: max(0.5rem, env(safe-area-inset-top)) max(0.5rem, env(safe-area-inset-right)) max(2rem, env(safe-area-inset-bottom)) max(0.5rem, env(safe-area-inset-left)); }
    @media (min-width: 768px) { body { padding: 1.25rem 2rem 2rem 2rem; } }
    .card { background: white; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05); max-width: 100%; overflow: hidden; }
    input, select, button { font-size: 16px !important; }
    @media (min-width: 768px) { input, select, button { font-size: 0.875rem !important; } }
    .num { font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
    /* 한국식 색: 상승 빨강, 하락 파랑 */
    .up { color: #e11d48; } .down { color: #2563eb; } .flat { color: #64748b; }
    .pill-up { background: #fff1f2; color: #e11d48; } .pill-down { background: #eff6ff; color: #2563eb; } .pill-flat { background: #f1f5f9; color: #64748b; }
    .hero-up { background: linear-gradient(135deg, #fff1f2 0%, #ffffff 70%); } .hero-down { background: linear-gradient(135deg, #eff6ff 0%, #ffffff 70%); } .hero-flat { background: #fff; }
    .dark .hero-up { background: linear-gradient(135deg, #4c0519 0%, #1e293b 70%) !important; } .dark .hero-down { background: linear-gradient(135deg, #172554 0%, #1e293b 70%) !important; }
    .dark .up { color: #fb7185; } .dark .down { color: #60a5fa; }
    .dark .pill-up { background: #4c0519; color: #fda4af; } .dark .pill-down { background: #172554; color: #93c5fd; } .dark .pill-flat { background: #334155; color: #cbd5e1; }
    .tile { transition: transform .12s ease, box-shadow .12s ease; }
    .tile:active { transform: scale(.98); }
    .tile.sel { box-shadow: 0 0 0 2px #6366f1 inset; }
    .row:active { background: #f8fafc; }
    .dark .row:active { background: #0f172a; }
    .skel { background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%); background-size: 200% 100%; animation: sk 1.2s infinite; border-radius: .375rem; }
    .dark .skel { background: linear-gradient(90deg, #334155 25%, #1e293b 50%, #334155 75%); background-size: 200% 100%; }
    @keyframes sk { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .live-dot { width: 7px; height: 7px; border-radius: 9999px; background: #10b981; box-shadow: 0 0 0 0 rgba(16,185,129,.6); animation: pulse 1.8s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16,185,129,.55); } 70% { box-shadow: 0 0 0 7px rgba(16,185,129,0); } 100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); } }
    .flash-up { animation: fu 1s ease; } .flash-down { animation: fd 1s ease; }
    @keyframes fu { 0% { background: rgba(225,29,72,.18); } 100% { background: transparent; } }
    @keyframes fd { 0% { background: rgba(37,99,235,.18); } 100% { background: transparent; } }
    .chart-img { display: block; width: 100%; height: auto; background: #fff; border-radius: .5rem; }
    .dark .chart-img { filter: invert(.88) hue-rotate(180deg); }
    .chart-fail { font-size: 12px; color: #94a3b8; text-align: center; padding: 2rem .5rem; }
    .seg button[aria-pressed="true"] { background: #4f46e5; color: white; }
    .dark body { background-color: #0f172a !important; color: #f1f5f9 !important; }
    .dark .card { background-color: #1e293b !important; color: #f8fafc !important; border-color: #334155 !important; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3) !important; }
    .dark input, .dark select { background-color: #0f172a !important; color: #f8fafc !important; border-color: #334155 !important; }
    .dark .bg-white { background-color: #1e293b !important; }
.dark .bg-indigo-50\/60 { background-color: rgba(49,46,129,.35) !important; } .dark .border-indigo-100, .dark .border-indigo-300 { border-color: #3730a3 !important; } .dark .text-indigo-700 { color: #c7d2fe !important; }
    .dark .bg-white\/70 { background-color: rgba(51,65,85,.7) !important; color: #e2e8f0 !important; border-color: #475569 !important; }
    .dark .bg-slate-50 { background-color: #0f172a !important; border-color: #334155 !important; color: #cbd5e1 !important; }
    .dark .bg-slate-100 { background-color: #334155 !important; color: #cbd5e1 !important; }
    .dark .text-slate-800, .dark .text-slate-900 { color: #f8fafc !important; }
    .dark .text-slate-500, .dark .text-slate-600, .dark .text-slate-700 { color: #94a3b8 !important; }
    .dark .border-slate-200, .dark .border-slate-100 { border-color: #334155 !important; }
    .dark .divide-slate-100 > * + * { border-color: #334155 !important; }
    /* 사이드 메뉴 */
    #sideNav { transform: translateX(-100%); transition: transform .22s ease; }
    #sideNav.open { transform: translateX(0); }
    #sideNavBackdrop { opacity: 0; pointer-events: none; transition: opacity .2s ease; }
    #sideNavBackdrop.open { opacity: 1; pointer-events: auto; }
    .dark #sideNav { background-color: #1e293b !important; border-color: #334155 !important; }
    .nav-item.active { background-color: #eef2ff; color: #4338ca; }
    .dark .nav-item.active { background-color: #312e81; color: #e0e7ff; }
    .dark .nav-item:not(.active) { color: #cbd5e1; }
    @media (prefers-reduced-motion: reduce) { #sideNav, #sideNavBackdrop, .tile, .skel, .live-dot, .flash-up, .flash-down { transition: none; animation: none; } }
      .line-dot { width: .6rem; height: .6rem; border-radius: 9999px; display: inline-block; flex-shrink: 0; }
    .tick { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="text-slate-800">
  <!-- 사이드 메뉴 (가계부와 동일) -->
  <div id="sideNavBackdrop" onclick="closeSideNav()" class="fixed inset-0 bg-slate-900/40 z-40"></div>
  <nav id="sideNav" aria-label="페이지 이동" class="fixed top-0 left-0 bottom-0 w-64 max-w-[80vw] bg-white border-r border-slate-200 z-50 p-4 flex flex-col gap-1 shadow-xl" style="padding-top: max(1rem, env(safe-area-inset-top));">
    <div class="flex items-center justify-between mb-3"><p class="text-sm font-extrabold text-slate-900">💎 아르곤 자산관리</p><button type="button" onclick="closeSideNav()" class="text-slate-400 text-lg font-bold px-2" aria-label="메뉴 닫기">✕</button></div>
    <a href="./" class="nav-item flex items-center gap-2 px-3 py-2.5 rounded-xl text-sm font-bold text-slate-700 hover:bg-slate-100">📒 <span>가계부</span></a>
    <a href="./stocks.html" class="nav-item flex items-center gap-2 px-3 py-2.5 rounded-xl text-sm font-bold text-slate-700 hover:bg-slate-100">📈 <span>주식 현황</span></a>
    <a href="./assets.html" class="nav-item flex items-center gap-2 px-3 py-2.5 rounded-xl text-sm font-bold text-slate-700 hover:bg-slate-100">💎 <span>내 자산</span></a>
    <a href="./lotto.html" class="nav-item flex items-center gap-2 px-3 py-2.5 rounded-xl text-sm font-bold text-slate-700 hover:bg-slate-100">🍀 <span>로또 번호</span></a>
    <a href="./subway.html" class="nav-item active flex items-center gap-2 px-3 py-2.5 rounded-xl text-sm font-bold">🚇 <span>지하철</span></a>
    <div class="mt-auto pt-3 border-t border-slate-100"><button type="button" onclick="toggleDark()" id="darkBtn" class="w-full text-left px-3 py-2 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100">🌙 다크 모드</button></div>
  </nav>
  <div class="w-full max-w-3xl mx-auto space-y-3 md:space-y-4">
    <header class="card p-4">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2 min-w-0">
          <button type="button" onclick="openSideNav()" aria-label="메뉴 열기" class="w-9 h-9 flex items-center justify-center rounded-xl bg-white/70 border border-slate-200 text-slate-700 font-bold shrink-0">☰</button>
          <h1 class="text-base sm:text-lg md:text-xl font-extrabold text-slate-900 tracking-tight truncate">🚇 지하철</h1>
        </div>
        <button type="button" onclick="refresh(true)" aria-label="새로고침" id="refreshBtn" class="w-9 h-9 flex items-center justify-center rounded-xl bg-white/70 border border-slate-200 text-slate-700 shrink-0">🔄</button>
      </div>
      <p id="status" class="text-[11px] font-bold text-slate-500 mt-2"></p>
      <div class="grid grid-cols-2 gap-2 mt-3">
        <a href="https://map.naver.com/p/subway" target="_blank" rel="noopener" class="py-2.5 rounded-xl bg-indigo-600 text-white text-sm font-bold text-center">🗺️ 노선도 보기</a>
        <button type="button" onclick="document.getElementById('routeSec').scrollIntoView({ behavior: 'smooth', block: 'start' }); document.getElementById('rFrom').focus()" class="py-2.5 rounded-xl bg-white border border-slate-200 text-slate-700 text-sm font-bold text-center">🧭 길찾기</button>
      </div>
    </header>

    <div id="keyBox"></div>

    <!-- 길찾기 -->
    <section id="routeSec" class="card p-4">
      <h2 class="text-sm md:text-base font-extrabold text-slate-900 mb-2">🧭 길찾기</h2>
      <form id="routeForm" class="space-y-2" autocomplete="off">
        <div class="flex items-center gap-2">
          <div class="flex-1 space-y-2 min-w-0">
            <input id="rFrom" list="stationList" maxlength="20" placeholder="출발역 (예: 강남)" class="w-full border border-slate-200 rounded-xl px-3 py-2 bg-white" aria-label="출발역">
            <input id="rTo" list="stationList" maxlength="20" placeholder="도착역 (예: 판교)" class="w-full border border-slate-200 rounded-xl px-3 py-2 bg-white" aria-label="도착역">
          </div>
          <button type="button" onclick="swapRoute()" aria-label="출발·도착 바꾸기" class="w-10 h-10 rounded-xl bg-slate-100 text-slate-600 font-bold shrink-0">⇅</button>
        </div>
        <datalist id="stationList"></datalist>
        <p id="rMsg" class="text-xs text-rose-600 hidden"></p>
        <button type="submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl">경로 보기 (구글 지도)</button>
      </form>
      <div id="recent" class="flex flex-wrap gap-1.5 mt-2"></div>
      <div id="routeLive" class="mt-3"></div>
      <p class="text-[10px] text-slate-400 mt-2">경로·소요시간·환승은 구글 지도에서 대중교통 기준으로 보여줘요. 아래엔 출발역 실시간 도착을 같이 띄워줘요.</p>
    </section>

    <section class="card p-4">
      <div class="flex justify-between items-center mb-2">
        <h2 class="text-sm md:text-base font-extrabold text-slate-900">⭐ 즐겨찾는 역</h2>
        <button type="button" onclick="toggleEdit()" id="editBtn" class="text-xs font-bold text-slate-500 px-2 py-1 rounded-lg hover:bg-slate-100">편집</button>
      </div>
      <div id="favs" class="space-y-3"></div>
      <form id="addForm" class="mt-3 flex gap-2" autocomplete="off">
        <input id="addName" maxlength="20" placeholder="역 이름 (예: 강남, 판교)" class="flex-1 min-w-0 border border-slate-200 rounded-xl px-3 py-2 bg-white" aria-label="추가할 역 이름">
        <select id="addTag" class="border border-slate-200 rounded-xl px-2 py-2 bg-white text-sm" aria-label="구분">
          <option value="">구분 없음</option><option value="출근">🌅 출근</option><option value="퇴근">🌙 퇴근</option>
        </select>
        <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shrink-0">추가</button>
      </form>
      <p id="addMsg" class="text-xs text-rose-600 mt-1.5 hidden"></p>
    </section>

    <p class="text-[11px] text-slate-400 text-center px-3 leading-relaxed">도착 정보는 서울시 열린데이터광장의 실시간 정보예요. 화면을 보는 동안 20초마다 새로 받아요.<br>수도권 1~9호선과 경의중앙·공항철도·수인분당·신분당선 등 주요 노선을 지원해요.</p>
  </div>

  <script>
    const FAV_KEY = 'argon_subway_v1';
    function load(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
    function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const isDark = () => document.documentElement.classList.contains('dark');
    const clean = n => { n = String(n || '').trim().replace(/\s+/g, ''); return n === '서울역' ? '서울' : n.replace(/역$/, ''); };
    const label = n => n === '서울' ? '서울역' : n + '역';

    let favs = load(FAV_KEY, []);   // [{ id, name, tag: '출근'|'퇴근'|'' }]
    let data = {}, demo = false, needKey = false, loadedAt = 0, editing = false, loading = false;

    // 출근 시간대(오후 2시 전)엔 출근 역을, 그 뒤엔 퇴근 역을 위로
    function ordered() {
      const am = new Date().getHours() < 14, rank = f => f.tag === (am ? '출근' : '퇴근') ? 0 : f.tag ? 2 : 1;
      return favs.slice().sort((a, b) => rank(a) - rank(b));
    }
    async function fetchStation(name) {
      const r = await fetch(`./api/subway?station=${encodeURIComponent(name)}`);
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || '불러오지 못했어요');
      return j;
    }
    async function refresh(manual) {
      if (loading || !favs.length) { render(); return; }
      loading = true; document.getElementById('refreshBtn').style.opacity = '.5';
      const results = await Promise.all(favs.map(f => fetchStation(f.name).then(j => [f.name, j], e => [f.name, { error: e.message }])));
      results.forEach(([n, j]) => { data[n] = j; if (j.demo) demo = true; if (j.needKey) needKey = true; });
      loadedAt = Date.now(); loading = false; document.getElementById('refreshBtn').style.opacity = '';
      render();
    }

    // 도착 메시지 → 짧게, 곧 도착이면 강조
    function soon(a) { return ['0', '1', '3', '4', '5'].includes(String(a.code)) || /도착|진입|전역/.test(a.msg || ''); }
    function msgText(a) {
      let m = String(a.msg || '').replace(/\[(\d+)\]번째 전역/, '$1정거장 전').replace(/\s*\(.*\)$/, '');
      if (a.sec > 0) { const left = Math.max(0, a.sec - Math.floor((Date.now() - loadedAt) / 1000)); m = left > 0 ? `${Math.floor(left / 60)}분 ${String(left % 60).padStart(2, '0')}초 후` : '곧 도착'; }
      return m || '-';
    }
    function stationCard(f) {
      const d = data[f.name];
      const del = editing ? `<button type="button" onclick="removeFav(${f.id})" class="text-xs font-bold text-rose-600 px-2 py-1 rounded-lg bg-rose-50">삭제</button>` : `<a href="https://map.kakao.com/link/search/${encodeURIComponent(label(f.name))}" target="_blank" rel="noopener" class="text-[11px] font-bold text-indigo-600">지도 ↗</a>`;
      let body;
      if (!d) body = `<div class="skel" style="height:56px"></div>`;
      else if (d.error) body = `<p class="text-xs text-rose-600">${esc(d.error)}</p>`;
      else if (d.needKey) body = `<p class="text-xs text-slate-500">실시간 키를 넣으면 이 역 도착 정보가 나와요. (지금은 서울역만 체험 가능)</p>`;
      else if (d.notFound || !d.arrivals.length) body = `<p class="text-xs text-slate-500">지금 도착 정보가 없어요. 역 이름을 확인하거나, 운행 시간이 아닐 수 있어요.</p>`;
      else {
        // 노선 → 방향별로 다음 열차 2대
        const lines = {};
        d.arrivals.forEach(a => { const L = (lines[a.line] = lines[a.line] || { name: a.lineName, color: a.color, dirs: {} }); (L.dirs[a.dir] = L.dirs[a.dir] || []).push(a); });
        body = Object.values(lines).map(L => `<div class="mt-2 first:mt-0">
            <p class="flex items-center gap-1.5 text-xs font-extrabold" style="color:${L.color}"><span class="line-dot" style="background:${L.color}"></span>${esc(L.name)}</p>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-1.5 mt-1">${Object.entries(L.dirs).map(([dir, list]) => {
              list.sort((a, b) => String(a.order).localeCompare(String(b.order)));
              const dest = (list[0].to || '').split(' - ')[1] || dir;
              return `<div class="bg-slate-50 rounded-lg px-2.5 py-2">
                  <p class="text-[10px] font-bold text-slate-400 truncate">${esc(dir)} · ${esc(dest)}</p>
                  ${list.slice(0, 2).map((a, i) => `<div class="flex items-center justify-between gap-2 ${i ? 'mt-0.5' : 'mt-1'}">
                      <span class="text-xs font-bold text-slate-700 truncate">${esc(a.dest || '')}행${a.express ? ` <span class="text-[9px] px-1 py-0.5 rounded bg-rose-100 text-rose-600 font-extrabold">${esc(a.express)}</span>` : ''}${a.last ? ' <span class="text-[9px] px-1 py-0.5 rounded bg-slate-800 text-white font-extrabold">막차</span>' : ''}</span>
                      <span class="tick text-xs font-extrabold shrink-0 ${i === 0 && soon(a) ? 'text-rose-600' : 'text-slate-900'}" data-sec="${a.sec}">${esc(msgText(a))}</span>
                    </div>`).join('')}
                </div>`;
            }).join('')}</div>
          </div>`).join('');
      }
      const tag = f.tag ? `<span class="text-[10px] font-bold px-1.5 py-0.5 rounded-full ${f.tag === '출근' ? 'bg-amber-100 text-amber-700' : 'bg-indigo-100 text-indigo-700'}">${f.tag === '출근' ? '🌅 출근' : '🌙 퇴근'}</span>` : '';
      return `<div class="border border-slate-100 rounded-xl p-3">
          <div class="flex items-center justify-between gap-2 mb-1"><p class="text-sm font-extrabold text-slate-900 flex items-center gap-1.5">${esc(label(f.name))} ${tag}</p>${del}</div>
          ${body}
        </div>`;
    }
    function render() {
      const box = document.getElementById('favs');
      document.getElementById('editBtn').textContent = editing ? '완료' : '편집';
      document.getElementById('editBtn').classList.toggle('hidden', !favs.length);
      box.innerHTML = favs.length ? ordered().map(stationCard).join('')
        : `<p class="text-xs text-slate-400">자주 타는 역을 추가해 보세요. 출근·퇴근으로 나눠두면 시간대에 맞는 역이 위로 와요.</p>
           <button type="button" onclick="addFav('서울','')" class="mt-2 text-xs font-bold text-indigo-600">서울역으로 체험해보기 →</button>`;
      const t = new Date(loadedAt || Date.now());
      document.getElementById('status').textContent = favs.length ? (loadedAt ? `${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}:${String(t.getSeconds()).padStart(2, '0')} 기준 · 20초마다 갱신` : '불러오는 중…') : '';
      renderKeyBox();
    }
    function renderKeyBox() {
      const box = document.getElementById('keyBox');
      if (!(demo || needKey)) { box.innerHTML = ''; return; }
      box.innerHTML = `<section class="card p-4 border border-amber-200">
          <p class="text-sm font-extrabold text-slate-900">🔑 실시간 키를 넣으면 모든 역이 열려요</p>
          <p class="text-xs text-slate-500 mt-1">지금은 서울시 공개 테스트 키라서 <b>서울역만</b> 볼 수 있어요.</p>
          <ol class="text-xs text-slate-600 mt-2 space-y-1 list-decimal list-inside">
            <li><a href="https://data.seoul.go.kr" target="_blank" rel="noopener" class="text-indigo-600 font-bold">서울 열린데이터광장</a> 가입 → <b>인증키 신청</b> → <b>실시간 지하철 인증키</b> 발급 (무료)</li>
            <li>Vercel 프로젝트 → Settings → Environment Variables에 이름 <code class="bg-slate-100 px-1 rounded">SEOUL_SUBWAY_KEY</code>, 값에 받은 키</li>
            <li>Deployments에서 최신 배포 <b>Redeploy</b> 한 번</li>
          </ol>
        </section>`;
    }

    // 초 단위 카운트다운 (서버는 20초마다)
    setInterval(() => { if (!loadedAt) return; document.querySelectorAll('[data-sec]').forEach(el => { const s = +el.dataset.sec; if (s > 0) { const left = Math.max(0, s - Math.floor((Date.now() - loadedAt) / 1000)); el.textContent = left > 0 ? `${Math.floor(left / 60)}분 ${String(left % 60).padStart(2, '0')}초 후` : '곧 도착'; } }); }, 1000);
    setInterval(() => { if (document.visibilityState === 'visible') refresh(false); }, 20000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - loadedAt > 10000) refresh(false); });

    // ---------- 길찾기 ----------
    const ROUTE_KEY = 'argon_subway_routes_v1';
    let routes = load(ROUTE_KEY, []);   // 최근 경로 [{ from, to }]
    function renderRoutes() {
      const names = [...new Set([...favs.map(f => f.name), ...routes.flatMap(r => [r.from, r.to])])];
      document.getElementById('stationList').innerHTML = names.map(n => `<option value="${esc(label(n))}">`).join('');
      document.getElementById('recent').innerHTML = routes.map((r, i) => `<span class="inline-flex items-center text-[11px] font-bold rounded-full bg-slate-100 text-slate-600"><button type="button" onclick="useRoute(${i})" class="pl-2.5 pr-1 py-1">${esc(label(r.from))} → ${esc(label(r.to))}</button><button type="button" onclick="dropRoute(${i})" aria-label="최근 경로 지우기" class="pr-2 pl-1 py-1 text-slate-400">✕</button></span>`).join('');
    }
    function swapRoute() { const a = document.getElementById('rFrom'), b = document.getElementById('rTo'); [a.value, b.value] = [b.value, a.value]; }
    function useRoute(i) { const r = routes[i]; if (!r) return; document.getElementById('rFrom').value = label(r.from); document.getElementById('rTo').value = label(r.to); go(r.from, r.to); }
    function dropRoute(i) { routes.splice(i, 1); save(ROUTE_KEY, routes); renderRoutes(); }
    function go(from, to) {
      const url = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(label(from))}&destination=${encodeURIComponent(label(to))}&travelmode=transit`;
      routes = [{ from, to }, ...routes.filter(r => !(r.from === from && r.to === to))].slice(0, 5); save(ROUTE_KEY, routes); renderRoutes();
      window.open(url, '_blank', 'noopener');
      showLive(from);
    }
    async function showLive(name) {
      const box = document.getElementById('routeLive');
      if (favs.some(f => f.name === name)) { box.innerHTML = ''; return; }   // 즐겨찾기에 있으면 아래에서 보임
      box.innerHTML = `<p class="text-xs font-bold text-slate-500 mb-1">🚉 ${esc(label(name))} 지금 도착</p><div class="skel" style="height:56px"></div>`;
      try { data[name] = await fetchStation(name); } catch (e) { data[name] = { error: e.message }; }
      box.innerHTML = `<p class="text-xs font-bold text-slate-500 mb-1">🚉 출발역 지금 도착 <button type="button" onclick="addFav('${esc(name)}','')" class="ml-1 text-indigo-600">⭐ 즐겨찾기에 추가</button></p>` + stationCard({ id: 0, name, tag: '' });
    }
    document.getElementById('routeForm').addEventListener('submit', e => {
      e.preventDefault();
      const msg = document.getElementById('rMsg'), from = clean(document.getElementById('rFrom').value), to = clean(document.getElementById('rTo').value);
      const bad = n => !n || !/^[가-힣0-9A-Za-z()·.]{1,20}$/.test(n);
      if (bad(from) || bad(to)) { msg.textContent = '출발역과 도착역을 넣어주세요.'; msg.classList.remove('hidden'); return; }
      if (from === to) { msg.textContent = '출발역과 도착역이 같아요.'; msg.classList.remove('hidden'); return; }
      msg.classList.add('hidden'); go(from, to);
    });

    function addFav(name, tag) {
      const msg = document.getElementById('addMsg'), n = clean(name);
      if (!n || !/^[가-힣0-9A-Za-z()·.]{1,20}$/.test(n)) { msg.textContent = '역 이름을 확인해 주세요. (예: 강남, 판교)'; msg.classList.remove('hidden'); return; }
      if (favs.some(f => f.name === n)) { msg.textContent = '이미 추가된 역이에요.'; msg.classList.remove('hidden'); return; }
      msg.classList.add('hidden');
      favs.push({ id: Math.max(Date.now(), ...favs.map(f => f.id + 1)), name: n, tag: tag || '' }); save(FAV_KEY, favs);
      document.getElementById('addName').value = '';
      delete data[n]; render(); renderRoutes(); refresh(true);
      if (document.getElementById('routeLive').innerHTML.includes(label(n))) document.getElementById('routeLive').innerHTML = '';
    }
    function removeFav(id) { favs = favs.filter(f => f.id !== id); save(FAV_KEY, favs); if (!favs.length) editing = false; render(); }
    function toggleEdit() { editing = !editing; render(); }
    document.getElementById('addForm').addEventListener('submit', e => { e.preventDefault(); addFav(document.getElementById('addName').value, document.getElementById('addTag').value); });

    function openSideNav() { document.getElementById('sideNav').classList.add('open'); document.getElementById('sideNavBackdrop').classList.add('open'); }
    function closeSideNav() { document.getElementById('sideNav').classList.remove('open'); document.getElementById('sideNavBackdrop').classList.remove('open'); }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSideNav(); });
    function toggleDark() {
      const on = !isDark(); document.documentElement.classList.toggle('dark', on);
      try { localStorage.setItem('argon_dark_mode', String(on)); } catch (e) {}
      document.getElementById('darkBtn').textContent = on ? '☀️ 라이트 모드' : '🌙 다크 모드';
    }
    document.getElementById('darkBtn').textContent = isDark() ? '☀️ 라이트 모드' : '🌙 다크 모드';
    render(); renderRoutes(); refresh(false);
    // 즐겨찾기가 없어도 실시간 키가 있는지 한 번 확인 (서울역 조회)
    if (!favs.length) fetchStation('서울').then(j => { if (j.demo) { demo = true; renderKeyBox(); } }).catch(() => {});
  </script>
</body>
</html>
